<!DOCTYPE html>
<!-- SPDX-License-Identifier: AGPL-3.0-or-later -->
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Necesse — .lang</title>
<style>
  :root{
    --bg:#14110d;            /* deep dungeon soil */
    --panel:#1d1913;
    --panel-2:#241f17;
    --line:#352d21;
    --line-soft:#2a241b;
    --ink:#efe6d4;           /* warm parchment text */
    --ink-dim:#a89a80;
    --ink-faint:#7b6f5a;
    --torch:#e8a13a;         /* torchlight amber accent */
    --torch-soft:#3a2c14;
    --ok:#7fc98b;            /* moss green */
    --ok-soft:#1f3324;
    --same:#82b6e0;          /* cold stone blue */
    --same-soft:#1c2c3a;
    --warn:#e2695b;
    --warn-soft:#37201d;
    /* token hues */
    --tok-var:#e0b64a;
    --tok-ref:#7fb0e6;
    --tok-fmt:#c98be0;
    --tok-nl:#8a9bb0;
    --mono: ui-monospace,"JetBrains Mono","SF Mono",Menlo,Consolas,monospace;
    --sans: "Inter",system-ui,-apple-system,Segoe UI,Roboto,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{
    margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);
    font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;
    display:flex;flex-direction:column;height:100vh;overflow:hidden;
  }
  button{font-family:inherit;cursor:pointer}
  a{color:var(--torch)}

  /* ---------- top bar ---------- */
  header{
    display:flex;align-items:center;gap:12px 16px;padding:12px 18px;flex-wrap:wrap;
    background:linear-gradient(180deg,#221c14,#1a1610);
    border-bottom:1px solid var(--line);flex:0 0 auto;
  }
  .brand{display:flex;align-items:baseline;gap:10px;user-select:none}
  .brand .mark{
    font-family:var(--mono);font-weight:700;letter-spacing:.5px;color:var(--torch);
    font-size:15px;text-shadow:0 0 14px rgba(232,161,58,.35);
  }
  .brand .sub{font-size:11px;color:var(--ink-faint);letter-spacing:.14em;text-transform:uppercase}

  .grow{flex:1}
  select.uilang{background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink-dim);
    font-family:var(--sans);font-size:12.5px;padding:6px 9px;outline:none;transition:.12s;
    flex:0 0 108px;width:108px}
  select.uilang:hover{color:var(--ink)}
  select.uilang:focus{border-color:var(--torch);box-shadow:0 0 0 3px rgba(232,161,58,.12)}
  .filebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;flex:0 1 auto}
  .btn{
    border:1px solid var(--line);background:var(--panel-2);color:var(--ink);
    padding:7px 13px;border-radius:7px;font-size:13px;transition:.15s;white-space:nowrap;
    text-align:center;overflow:hidden;text-overflow:ellipsis;
  }
  .btn:hover{border-color:var(--torch);color:#fff}
  .btn.primary{background:var(--torch);border-color:var(--torch);color:#1a1204;font-weight:600}
  .btn.primary:hover{background:#f2b256;color:#1a1204}
  .btn.ghost{background:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed;border-color:var(--line)!important;color:var(--ink-dim)!important}
  /* Fixed widths sized for the longer RU labels so EN/RU switch doesn't reflow the bar */
  #btnEnRef{width:148px;flex:0 0 148px;padding-left:8px;padding-right:8px}
  #btnSaveJson,#btnLoadJson{width:158px;flex:0 0 158px;padding-left:8px;padding-right:8px}
  #btnNew{width:108px;flex:0 0 108px;padding-left:8px;padding-right:8px}
  #btnExport{width:128px;flex:0 0 128px;padding-left:8px;padding-right:8px}
  .fname{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--ink-faint);white-space:nowrap;flex:0 0 auto}
  .fname input{width:118px;background:var(--bg);border:1px solid var(--line);border-radius:7px;
    color:var(--ink);font-family:var(--mono);font-size:12.5px;padding:7px 9px;outline:none;transition:.12s}
  .fname input:focus{border-color:var(--torch);box-shadow:0 0 0 3px rgba(232,161,58,.12)}

  /* ---------- progress meter ---------- */
  .meter{display:flex;align-items:center;gap:10px;width:240px;flex:0 0 240px;max-width:240px}
  .meter .bar{position:relative;flex:1;min-width:0;height:8px;border-radius:6px;background:#2a241b;overflow:hidden;border:1px solid var(--line-soft)}
  .meter .fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#c9821f,var(--torch));transition:width .3s}
  .meter .pct{font-family:var(--mono);font-size:12px;color:var(--ink-dim);width:112px;flex:0 0 112px;text-align:right;white-space:nowrap}
  .meter .pct b{color:var(--torch)}

  /* ---------- layout ---------- */
  main{flex:1;display:flex;min-height:0}
  .side{
    flex:0 0 236px;background:var(--panel);border-right:1px solid var(--line);
    display:flex;flex-direction:column;min-height:0;
  }
  .side .block{padding:14px 14px 6px;border-bottom:1px solid var(--line-soft)}
  .side .lbl{font-size:10px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  .filters{display:flex;flex-direction:column;gap:2px;padding:8px}
  .filt{
    display:flex;align-items:center;justify-content:space-between;gap:8px;
    padding:8px 10px;border-radius:7px;border:1px solid transparent;background:transparent;color:var(--ink-dim);
    font-size:13px;text-align:left;width:100%;transition:.12s;
  }
  .filt:hover{background:var(--panel-2);color:var(--ink)}
  .filt.on{background:var(--torch-soft);border-color:#5a431c;color:#fff}
  .filt .cnt{font-family:var(--mono);font-size:11px;color:var(--ink-faint)}
  .filt.on .cnt{color:var(--torch)}
  .filt .dot{width:8px;height:8px;border-radius:2px;flex:0 0 auto}
  .filt .l{display:flex;align-items:center;gap:9px;overflow:hidden}
  .dot-missing{background:var(--torch)} .dot-same{background:var(--same)} .dot-done{background:var(--ok)} .dot-all{background:var(--ink-faint)}

  .sections{flex:1;overflow:auto;padding:6px 8px}
  .sec-jump{
    display:block;width:100%;text-align:left;padding:5px 10px;border-radius:6px;
    background:transparent;border:none;color:var(--ink-dim);font-family:var(--mono);font-size:12px;
  }
  .sec-jump:hover{background:var(--panel-2);color:var(--torch)}
  .sec-jump .sc{float:right;color:var(--ink-faint);font-size:11px}

  /* ---------- work area ---------- */
  .work{flex:1;display:flex;flex-direction:column;min-height:0}
  .toolbar{
    display:flex;align-items:center;gap:12px;padding:10px 16px;
    border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;
  }
  .search{
    flex:1;max-width:560px;display:flex;align-items:center;gap:8px;
    background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 12px;
  }
  .search input{flex:1;background:transparent;border:none;outline:none;color:var(--ink);font-size:13px}
  .search input::placeholder{color:var(--ink-faint)}
  .search .ic{color:var(--ink-faint)}
  .hint{font-size:12px;color:var(--ink-faint)}
  .hint kbd{font-family:var(--mono);background:var(--panel-2);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--ink-dim);font-size:11px}

  .list{flex:1;overflow:auto;padding:14px 16px 120px;scroll-behavior:smooth}

  /* section divider row */
  .sec-head{
    display:flex;align-items:center;gap:12px;margin:22px 0 12px;
    color:var(--torch);font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;
  }
  .sec-head:first-child{margin-top:4px}
  .sec-head::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--line),transparent)}

  /* ---------- entry card ---------- */
  .card{
    background:var(--panel);border:1px solid var(--line-soft);border-radius:10px;
    padding:12px 14px;margin-bottom:10px;transition:border-color .15s;
    border-left:3px solid var(--line);
  }
  .card.st-missing{border-left-color:var(--torch)}
  .card.st-done{border-left-color:var(--ok)}
  .card.st-same{border-left-color:var(--same)}
  .card:focus-within{border-color:var(--line);border-left-color:var(--torch);background:var(--panel-2)}

  .card .row1{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .key{
    font-family:var(--mono);font-size:12.5px;color:var(--ink);background:var(--bg);
    border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer;transition:.12s;
  }
  .key:hover{border-color:var(--torch);color:var(--torch)}
  .badge{font-size:10px;letter-spacing:.1em;text-transform:uppercase;padding:2px 7px;border-radius:5px;font-family:var(--mono)}
  .b-missing{background:var(--torch-soft);color:var(--torch)}
  .b-done{background:var(--ok-soft);color:var(--ok)}
  .b-same{background:var(--same-soft);color:var(--same)}
  .spacer{flex:1}

  .orig{
    font-size:13.5px;color:var(--ink-dim);background:var(--bg);border:1px solid var(--line-soft);
    border-radius:7px;padding:8px 11px;margin-bottom:8px;white-space:pre-wrap;word-break:break-word;line-height:1.55;
  }
  .orig .olabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:4px}

  /* textarea + whitespace overlay: one rule sets metrics for BOTH so they can't drift */
  .tawrap{position:relative;background:var(--bg);border:1px solid var(--line);border-radius:7px;transition:.12s}
  .tawrap:focus-within{border-color:var(--torch);box-shadow:0 0 0 3px rgba(232,161,58,.12)}
  .tawrap>textarea,.tawrap>.wsback{
    font-family:var(--sans);font-size:14px;line-height:1.55;padding:9px 11px;
    border:0;margin:0;white-space:pre-wrap;overflow-wrap:break-word;word-break:break-word;
    letter-spacing:normal;tab-size:4;
  }
  .tawrap.rv>textarea,.tawrap.rv>.wsback{font-size:13.5px;padding:8px 10px}
  .tawrap>textarea{
    display:block;width:100%;background:transparent;color:var(--ink);
    resize:vertical;min-height:42px;outline:none;position:relative;z-index:1;
  }
  .tawrap.rv>textarea{min-height:38px}
  .wsback{
    position:absolute;top:0;left:0;right:0;bottom:0;overflow:hidden;
    color:transparent;pointer-events:none;z-index:0;border-radius:7px;
  }
  .wsback .wsb{background:rgba(226,105,91,.34);box-shadow:inset 0 0 0 1px rgba(226,105,91,.6);border-radius:2px}

  .card .row3{display:flex;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}
  .chip{
    font-family:var(--mono);font-size:11.5px;padding:3px 8px;border-radius:5px;
    border:1px solid var(--line);background:var(--panel-2);cursor:pointer;transition:.12s;
  }
  .chip:hover{border-color:var(--torch)}
  .chip.var{color:var(--tok-var)} .chip.ref{color:var(--tok-ref)} .chip.fmt{color:var(--tok-fmt)} .chip.nl{color:var(--tok-nl)}
  .chip.miss{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
  .chip.miss::before{content:"⚠ ";}
  .toklead{font-size:11px;color:var(--ink-faint);margin-right:2px}
  .samebtn{
    margin-left:auto;font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);
    background:transparent;color:var(--ink-dim);transition:.12s;
  }
  .samebtn:hover{border-color:var(--same);color:var(--same)}
  .samebtn.on{background:var(--same-soft);border-color:var(--same);color:var(--same)}
  .warnline{width:100%;font-size:12px;color:var(--warn);margin-top:2px}

  /* token colouring inside orig */
  .t-var{color:var(--tok-var);font-family:var(--mono);font-size:.94em}
  .t-ref{color:var(--tok-ref);font-family:var(--mono);font-size:.94em}
  .t-fmt{color:var(--tok-fmt);font-family:var(--mono);font-size:.94em;background:rgba(201,139,224,.12);border-radius:3px;padding:0 2px}
  .t-nl{color:var(--tok-nl);font-family:var(--mono);font-size:.94em;background:rgba(138,155,176,.14);border-radius:3px;padding:0 3px}

  /* ---------- empty / drop ---------- */
  .empty{flex:1;display:flex;align-items:center;justify-content:center;padding:40px}
  .drop{
    width:min(560px,90%);border:1.5px dashed var(--line);border-radius:16px;padding:44px 34px;text-align:center;
    background:var(--panel);transition:.15s;
  }
  .drop.over{border-color:var(--torch);background:var(--panel-2)}
  .drop h1{margin:0 0 6px;font-family:var(--mono);font-size:20px;color:var(--torch);font-weight:700;letter-spacing:.5px}
  .drop p{margin:0 0 20px;color:var(--ink-dim);font-size:13.5px}
  .drop .lg{width:56px;height:56px;margin:0 auto 18px;border-radius:12px;background:var(--torch-soft);
    display:flex;align-items:center;justify-content:center;font-size:26px}
  .legend{display:flex;justify-content:center;gap:16px;flex-wrap:wrap;margin-top:22px;font-size:11.5px;color:var(--ink-faint)}
  .legend span{display:flex;align-items:center;gap:6px}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block}

  /* ---------- restore banner ---------- */
  .restore{
    display:flex;align-items:center;gap:14px;padding:10px 16px;background:var(--ok-soft);
    border-bottom:1px solid #2c4a34;color:#cdeacf;font-size:13px;flex:0 0 auto;
  }
  .restore .grow2{flex:1}
  .restore button{font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid #3a5c40;background:transparent;color:#cdeacf}
  .restore button.p{background:var(--ok);color:#0e2113;border-color:var(--ok);font-weight:600}

  /* ---------- toast ---------- */
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);
    background:#0f0c08;border:1px solid var(--torch);color:var(--ink);padding:9px 18px;border-radius:9px;
    font-size:13px;opacity:0;pointer-events:none;transition:.22s;z-index:50;box-shadow:0 8px 30px rgba(0,0,0,.5);
  }
  #toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

  .footnote{padding:9px 16px;font-size:11.5px;color:var(--ink-faint);border-top:1px solid var(--line);background:var(--panel);flex:0 0 auto;text-align:center}

  /* ---------- MT bar ---------- */
  .mtbar{display:flex;align-items:center;gap:16px;padding:9px 16px;border-bottom:1px solid var(--line);
    background:var(--panel-2);flex:0 0 auto;flex-wrap:wrap}
  .mtbar .grp{display:flex;align-items:center;gap:7px;font-size:11px;color:var(--ink-faint);letter-spacing:.03em}
  .mtbar select,.mtbar .mini{background:var(--bg);border:1px solid var(--line);border-radius:7px;color:var(--ink);
    font-family:var(--mono);font-size:12.5px;padding:6px 9px;outline:none;transition:.12s}
  .mtbar select:focus,.mtbar .mini:focus{border-color:var(--tok-ref);box-shadow:0 0 0 3px rgba(127,176,230,.12)}
  .mtbar .mini{width:64px}
  .mtprov{font-family:var(--mono);font-size:12.5px;color:var(--tok-ref);border-bottom:1px dotted var(--line);cursor:help}
  .mtbar .sp{flex:1}
  .mthint{font-size:11.5px;color:var(--ink-faint);white-space:nowrap}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;user-select:none;color:var(--ink-dim);font-size:12px}
  .toggle .tk{width:34px;height:19px;border-radius:11px;background:#3a3226;border:1px solid var(--line);position:relative;transition:.15s;flex:0 0 auto}
  .toggle .tk::after{content:"";position:absolute;top:2px;left:2px;width:13px;height:13px;border-radius:50%;background:var(--ink-dim);transition:.15s}
  .toggle.on .tk{background:var(--torch-soft);border-color:var(--torch)}
  .toggle.on .tk::after{left:16px;background:var(--torch)}

  .mtbtn{font-size:12px;padding:5px 11px;border-radius:6px;border:1px solid var(--line);background:transparent;
    color:var(--ink-dim);transition:.12s;display:inline-flex;align-items:center;gap:6px}
  .mtbtn:hover{border-color:var(--tok-ref);color:var(--tok-ref)}
  .mtbtn:disabled{opacity:.6;cursor:progress}
  .mtbtn .sp2{width:11px;height:11px;border:2px solid currentColor;border-top-color:transparent;border-radius:50%;animation:spin .7s linear infinite;display:none}
  .mtbtn.loading .sp2{display:inline-block}
  @keyframes spin{to{transform:rotate(360deg)}}
  .b-mt{background:#2a2140;color:#b79be6;display:none}
  .b-mt.on{display:inline-block}

  /* ---------- save-status pill ---------- */
  .savepill{display:flex;align-items:center;gap:8px;padding:6px 11px;border-radius:8px;border:1px solid var(--line);
    width:198px;flex:0 0 198px;overflow:hidden;
    background:var(--panel-2);font-size:12px;color:var(--ink-dim);cursor:pointer;transition:.12s;white-space:nowrap;font-family:var(--mono)}
  .savepill:hover{border-color:var(--ok);color:var(--ink)}
  .savepill .sdot{width:8px;height:8px;border-radius:50%;background:var(--ok);flex:0 0 auto;transition:.2s;box-shadow:0 0 8px rgba(127,201,139,.5)}
  .savepill #saveText{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
  .savepill.saving{color:var(--torch)}
  .savepill.saving .sdot{background:var(--torch);box-shadow:none;animation:pulse 1s infinite}
  .savepill.error{border-color:var(--warn);color:var(--warn)}
  .savepill.error .sdot{background:var(--warn);box-shadow:none}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.25}}

  /* ---------- tabs + review ---------- */
  .tabs{display:flex;gap:4px;padding:8px 16px 0;background:var(--panel);border-bottom:1px solid var(--line);flex:0 0 auto}
  .tab{border:1px solid transparent;border-bottom:none;background:transparent;color:var(--ink-dim);
    padding:8px 16px;border-radius:8px 8px 0 0;font-size:13px;transition:.12s}
  .tab:hover{color:var(--ink)}
  .tab.on{background:var(--bg);border-color:var(--line);color:var(--torch);position:relative;top:1px}
  .tab .tcount{font-family:var(--mono);font-size:11px;color:var(--ink-faint);margin-left:6px}
  .tab.on .tcount{color:var(--torch)}

  .reviewbar{display:flex;align-items:center;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;flex-wrap:wrap}
  .rchips{display:flex;gap:4px;flex-wrap:wrap}
  .rchip{border:1px solid var(--line);background:var(--panel-2);color:var(--ink-dim);padding:6px 11px;border-radius:7px;font-size:12.5px;transition:.12s}
  .rchip:hover{border-color:var(--torch);color:var(--ink)}
  .rchip.on{background:var(--torch-soft);border-color:var(--torch);color:#fff}
  .rchip .n{font-family:var(--mono);font-size:11px;opacity:.85;margin-left:5px}

  .reviewlist{flex:1;overflow:auto;padding:12px 16px 120px}
  .rrow{display:grid;grid-template-columns:170px 1fr 1fr 92px;gap:14px;align-items:start;
    padding:11px 12px;border:1px solid var(--line-soft);border-radius:9px;margin-bottom:8px;background:var(--panel);
    border-left:3px solid var(--ok)}
  .rrow.flag{border-left-color:var(--warn)}
  .rrow.mt{border-left-color:#9b7fd0}
  .rmeta{display:flex;flex-direction:column;gap:6px;min-width:0}
  .rkey{font-family:var(--mono);font-size:11.5px;color:var(--ink);background:var(--bg);border:1px solid var(--line);
    border-radius:6px;padding:3px 8px;cursor:pointer;word-break:break-all;text-align:left}
  .rkey:hover{border-color:var(--torch);color:var(--torch)}
  .rflags{display:flex;flex-wrap:wrap;gap:4px}
  .rflag{font-size:10px;font-family:var(--mono);padding:2px 6px;border-radius:4px;letter-spacing:.03em}
  .rflag.mt{background:#2a2140;color:#b79be6}
  .rflag.miss{background:var(--warn-soft);color:var(--warn)}
  .rflag.same{background:var(--same-soft);color:var(--same)}
  .rcol{min-width:0}
  .rlabel{font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);display:block;margin-bottom:4px}
  .ren{font-size:13px;color:var(--ink-dim);line-height:1.55;white-space:pre-wrap;word-break:break-word;
    background:var(--bg);border:1px solid var(--line-soft);border-radius:7px;padding:8px 10px}
  .rru textarea{width:100%}
  .rmiss{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
  .ractions{display:flex;flex-direction:column;gap:6px}
  .rbtn{font-size:12px;padding:5px 10px;border-radius:6px;border:1px solid var(--line);background:transparent;color:var(--ink-dim);white-space:nowrap;transition:.12s}
  .rbtn:hover{border-color:var(--torch);color:var(--torch)}
  .rbtn.ok:hover{border-color:var(--ok);color:var(--ok)}
  @media(max-width:920px){.rrow{grid-template-columns:1fr}.ractions{flex-direction:row}}

  /* ---------- autocomplete ---------- */
  .acbox{position:fixed;z-index:60;min-width:130px;max-width:280px;max-height:210px;overflow:auto;
    background:#100d09;border:1px solid var(--line);border-radius:9px;box-shadow:0 12px 34px rgba(0,0,0,.6);
    padding:4px;display:none;font-family:var(--sans)}
  .acbox.on{display:block}
  .acitem{padding:5px 10px;border-radius:6px;color:var(--ink-dim);cursor:pointer;font-size:13.5px;
    white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.4}
  .acitem.active{background:var(--torch-soft);color:#fff}
  .acitem b{color:var(--torch);font-weight:600}
  .acitem.active b{color:#ffce7a}
  .achint{font-size:10px;color:var(--ink-faint);padding:4px 10px 2px;border-top:1px solid var(--line-soft);margin-top:3px;letter-spacing:.03em}
  .acitem{display:flex;justify-content:space-between;gap:12px;align-items:baseline}
  .acw{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .acc{font-family:var(--mono);font-size:11px;color:var(--ink-faint);flex:0 0 auto}
  .acitem.active .acc{color:var(--torch)}
  .btn.okbtn{border-color:var(--ok);color:var(--ok)}
  .btn.okbtn:hover{border-color:var(--ok);color:#a9e0b0}
  .ren.empty-ref{color:var(--ink-faint);font-style:italic}

  /* ---------- whitespace markers ---------- */
  .ws{background:rgba(226,105,91,.28);color:var(--warn);border-radius:3px;font-family:var(--mono);
    outline:1px solid rgba(226,105,91,.4)}
  .dot-ws{background:var(--warn)}
  .filt.warn .cnt{color:var(--warn)}
  .chip.wsfix{border-color:var(--warn);background:var(--warn-soft);color:var(--warn)}
  .chip.wsfix:hover{border-color:#f08b7d;color:#f5a99d}
  .rflag.ws{background:var(--warn-soft);color:var(--warn)}
  .qhint{font-family:var(--mono);font-size:11.5px;color:var(--warn);white-space:nowrap}
  .qbtn{font-family:var(--mono);font-size:12px;padding:6px 9px;border-radius:7px;border:1px solid var(--line);
    background:var(--panel-2);color:var(--ink-dim);transition:.12s;white-space:nowrap}
  .qbtn:hover{border-color:var(--warn);color:var(--warn)}

  /* ---------- diff view ---------- */
  .diffbar{display:flex;align-items:center;gap:14px;padding:10px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex:0 0 auto;flex-wrap:wrap}
  .diffbar .sp{flex:1}
  .diffname{font-family:var(--mono);font-size:12.5px;color:var(--ink-dim)}
  .diffstat{font-family:var(--mono);font-size:12px;color:var(--ink-dim)}
  .diffstat .add{color:var(--ok)} .diffstat .del{color:var(--warn)} .diffstat .chg{color:var(--torch)}
  .difflist{flex:1;overflow:auto;padding:0;font-family:var(--mono);font-size:12.5px;line-height:1.5}
  .dhead{display:grid;grid-template-columns:46px 1fr 46px 1fr;position:sticky;top:0;z-index:2;
    background:var(--panel-2);border-bottom:1px solid var(--line);color:var(--ink-faint);font-size:11px;letter-spacing:.06em}
  .dhead>div{padding:6px 10px}
  .dhead .h2{border-left:1px solid var(--line)}
  .drow{display:grid;grid-template-columns:46px 1fr 46px 1fr;border-bottom:1px solid #221d16}
  .dnum{padding:2px 8px;text-align:right;color:var(--ink-faint);background:#171410;user-select:none;white-space:nowrap}
  .dtxt{padding:2px 10px;white-space:pre-wrap;word-break:break-word;overflow-wrap:anywhere;border-left:1px solid #221d16}
  .drow .side2{border-left:1px solid var(--line-soft)}
  .drow.eq .dtxt{color:var(--ink-dim)}
  .drow.del .dnum-l{background:#2a1512} .drow.del .txt-l{background:#2a1512;color:#f0b6ad}
  .drow.add .dnum-r{background:#132a19} .drow.add .txt-r{background:#132a19;color:#b6e6c2}
  .drow.chg .txt-l{background:#2a1512} .drow.chg .txt-r{background:#132a19}
  .drow.chg .dnum-l{background:#2a1512} .drow.chg .dnum-r{background:#132a19}
  .di-del{background:rgba(226,105,91,.42);border-radius:2px}
  .di-add{background:rgba(127,201,139,.4);border-radius:2px}
  .dgap{grid-column:1/-1;text-align:center;color:var(--ink-faint);background:#141009;padding:4px 0;font-size:11px;letter-spacing:.05em;border-bottom:1px solid #221d16;cursor:default}
  .difflist .empty-d{text-align:center;color:var(--ink-faint);padding:60px 20px;font-family:var(--sans);font-size:14px}
  @media(max-width:720px){.dhead,.drow{grid-template-columns:38px 1fr 38px 1fr}}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:#332b20;border-radius:8px;border:3px solid var(--panel)}
  ::-webkit-scrollbar-thumb:hover{background:#463a2a}
  @media (max-width:1100px){ .grow{display:none} }
  @media (max-width:560px){
    header{gap:8px 10px;padding:10px 12px}
    .btn{padding:6px 10px;font-size:12px}
    .savepill{padding:5px 9px;font-size:11px;width:168px;flex-basis:168px}
    .fname input{width:90px}
    .meter{order:5;width:100%;flex:1 1 100%;max-width:none}
    #btnEnRef,#btnSaveJson,#btnLoadJson,#btnNew,#btnExport{flex:1 1 auto;width:auto}
  }
  @media (prefers-reduced-motion: reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>

<body>

<header>
  <div class="brand">
    <span class="mark">necesse.lang</span>
    <span class="sub" data-i18n="app.sub"></span>
  </div>
  <select id="uiLang" class="uilang" aria-label="Interface language">
    <option value="en">English</option>
    <option value="ru">Русский</option>
    <option value="bg">Български</option>
  </select>
  <div class="meter" id="meter" style="display:none">
    <div class="bar"><div class="fill" id="fill"></div></div>
    <div class="pct" id="pct"></div>
  </div>
  <div class="grow"></div>
  <div class="filebar" id="topActions" style="display:none">
    <button class="savepill" id="savePill" data-i18n-title="save.title"><span class="sdot"></span><span id="saveText"></span></button>
    <button class="btn ghost" id="btnEnRef" data-i18n-title="btn.enRefTitle" data-i18n="btn.enRef"></button>
    <button class="btn ghost" id="btnSaveJson" data-i18n-title="btn.saveProgressTitle" data-i18n="btn.saveProgress"></button>
    <button class="btn ghost" id="btnLoadJson" data-i18n-title="btn.loadProgressTitle" data-i18n="btn.loadProgress"></button>
    <button class="btn ghost" id="btnNew" data-i18n="btn.newFile"></button>
    <label class="fname" data-i18n-title="fname.title">
      <span data-i18n="fname.label"></span>
      <input type="text" id="outName" spellcheck="false" placeholder="*.lang">
    </label>
    <button class="btn primary" id="btnExport" data-i18n="btn.export"></button>
  </div>
  <input type="file" id="fileInput" accept=".lang,.txt" hidden>
  <input type="file" id="jsonInput" accept=".json,.gz" hidden>
  <input type="file" id="enInput" accept=".lang,.txt" hidden>
</header>

<div class="restore" id="restore" style="display:none">
  <span>🕯️</span>
  <div class="grow2"><span data-i18n="restore.found"></span> <b id="restoreName"></b> (<span id="restoreWhen"></span>)</div>
  <button class="p" id="restoreYes" data-i18n="restore.continue"></button>
  <button id="restoreNo" data-i18n="restore.startOver"></button>
</div>

<main>
  <aside class="side" id="side" style="display:none">
    <div class="filters" id="filters">
      <button class="filt on" data-f="missing"><span class="l"><i class="dot dot-missing"></i><span data-i18n="filter.missing"></span></span><span class="cnt" id="c-missing">0</span></button>
      <button class="filt" data-f="done"><span class="l"><i class="dot dot-done"></i><span data-i18n="filter.done"></span></span><span class="cnt" id="c-done">0</span></button>
      <button class="filt" data-f="same"><span class="l"><i class="dot dot-same"></i><span data-i18n="filter.same"></span></span><span class="cnt" id="c-same">0</span></button>
      <button class="filt" data-f="all"><span class="l"><i class="dot dot-all"></i><span data-i18n="filter.all"></span></span><span class="cnt" id="c-all">0</span></button>
      <button class="filt" data-f="ws" data-i18n-title="filter.wsTitle"><span class="l"><i class="dot dot-ws"></i><span data-i18n="filter.ws"></span></span><span class="cnt" id="c-ws">0</span></button>
    </div>
    <div class="block"><div class="lbl" data-i18n="side.sections"></div></div>
    <div class="sections" id="sections"></div>
  </aside>

  <section class="work" id="work">
    <div class="empty" id="empty">
      <div class="drop" id="drop">
        <div class="lg">🗺️</div>
        <h1>*.lang</h1>
        <p data-i18n-html="drop.text"></p>
        <button class="btn primary" id="btnPick" data-i18n="drop.pick"></button>
        <div class="legend">
          <span><i style="background:var(--tok-var)"></i><span data-i18n-html="legend.var"></span></span>
          <span><i style="background:var(--tok-ref)"></i>[item/input=…]</span>
          <span><i style="background:var(--tok-fmt)"></i><span data-i18n="legend.fmt"></span></span>
          <span><i style="background:var(--tok-nl)"></i>\n</span>
        </div>
      </div>
    </div>

    <div class="tabs" id="tabs" style="display:none">
      <button class="tab on" data-v="editor" data-i18n="tab.editor"></button>
      <button class="tab" data-v="review"><span data-i18n="tab.review"></span> <span class="tcount" id="tabReviewCount">0</span></button>
      <button class="tab" data-v="diff" data-i18n="tab.diff"></button>
    </div>

    <div class="toolbar" id="toolbar" style="display:none">
      <div class="search">
        <span class="ic">⌕</span>
        <input type="text" id="search" data-i18n-ph="search.ph" autocomplete="off" spellcheck="false">
      </div>
      <button class="qbtn" id="btnFindDbl" data-i18n-title="btn.findDblTitle" data-i18n="btn.findDbl"></button>
      <button class="qbtn" id="btnFindTab" data-i18n-title="btn.findTabTitle" data-i18n="btn.findTab"></button>
      <span class="qhint" id="queryHint"></span>
      <span class="hint"><kbd>Ctrl</kbd>+<kbd>↵</kbd> <span data-i18n="hint.ctrlEnter"></span></span>
    </div>
    <div class="mtbar" id="mtbar" style="display:none">
      <label class="toggle on" id="spellToggle" data-i18n-title="toggle.spellTitle">
        <span class="tk"></span><span data-i18n="toggle.spell"></span>
      </label>
      <label class="toggle on" id="acToggle" data-i18n-title="toggle.acTitle">
        <span class="tk"></span><span data-i18n="toggle.ac"></span>
      </label>
      <div class="grp">
        <span data-i18n="mt.label"></span>
        <span class="mtprov" data-i18n="mt.google" data-i18n-title="mt.providerTitle"></span>
      </div>
      <div class="grp"><span data-i18n="mt.langLabel"></span><input class="mini" id="mtTarget" spellcheck="false" data-i18n-title="mt.langTitle"></div>
      <div class="sp"></div>
      <span class="mthint" data-i18n="mt.perLineHint"></span>
    </div>
    <div class="list" id="list" style="display:none"></div>

    <div class="reviewbar" id="reviewbar" style="display:none">
      <div class="search" style="max-width:340px">
        <span class="ic">⌕</span>
        <input type="text" id="reviewSearch" data-i18n-ph="review.searchPh" autocomplete="off">
      </div>
      <div class="rchips">
        <button class="rchip on" data-r="all"><span data-i18n="review.all"></span> <span class="n" id="rc-all">0</span></button>
        <button class="rchip" data-r="mt"><span data-i18n="review.mt"></span> <span class="n" id="rc-mt">0</span></button>
        <button class="rchip" data-r="issues"><span data-i18n="review.issues"></span> <span class="n" id="rc-issues">0</span></button>
        <button class="rchip" data-r="same"><span data-i18n="review.sameEng"></span> <span class="n" id="rc-same">0</span></button>
      </div>
      <div class="sp"></div>
      <span class="hint" data-i18n="review.scopeHint"></span>
    </div>
    <div class="reviewlist" id="reviewlist" style="display:none"></div>

    <div class="diffbar" id="diffbar" style="display:none">
      <button class="btn" id="btnDiffFile" data-i18n="diff.loadFile"></button>
      <span class="diffname" id="diffName"></span>
      <label class="toggle on" id="diffOnlyToggle" data-i18n-title="diff.onlyDiffTitle">
        <span class="tk"></span><span data-i18n="diff.onlyDiff"></span>
      </label>
      <div class="sp"></div>
      <span class="diffstat" id="diffStat"></span>
    </div>
    <div class="difflist" id="difflist" style="display:none"></div>
    <input type="file" id="diffInput" accept=".lang,.txt" hidden>
    <div class="footnote" id="footnote" style="display:none"></div>
  </section>
</main>

<div id="toast"></div>

(function(){
  const LS_KEY = "necesse_lang_translator_v1";
  const MISS = "MISSING_TRANSLATION:";
  const SAME = "SAME_TRANSLATION:";
  const TOKEN_RE = /<[^>]+>|\[[^\]]+\]|§(?:#[0-9a-fA-F]{6}|[0-9A-Za-z])|\\n/g;

  const $ = id => document.getElementById(id);

  // ---------- i18n ----------
  const LANG_KEY = "necesse_lang_translator_ui_lang";
  function detectLang(){
    try{
      const saved = localStorage.getItem(LANG_KEY);
      if (saved && I18N[saved]) return saved;
    }catch(e){}
    const nav = (navigator.language || "en").toLowerCase();
    if (nav.startsWith("bg")) return "bg"; // Добавяме проверка за български
    if (nav.startsWith("ru")) return "ru";
    return "en";
  }
  let UI = detectLang();
  function t(key, vars){
    let s = (I18N[UI] && I18N[UI][key]);
    if (s == null) s = (I18N.en[key] != null ? I18N.en[key] : key);
    if (vars) for (const k in vars) s = s.split("{"+k+"}").join(String(vars[k]));
    return s;
  }
  function applyI18n(root){
    const scope = root || document;
    scope.querySelectorAll("[data-i18n]").forEach(el => { el.textContent = t(el.dataset.i18n); });
    scope.querySelectorAll("[data-i18n-html]").forEach(el => { el.innerHTML = t(el.dataset.i18nHtml); });
    scope.querySelectorAll("[data-i18n-title]").forEach(el => { el.title = t(el.dataset.i18nTitle); });
    scope.querySelectorAll("[data-i18n-ph]").forEach(el => { el.placeholder = t(el.dataset.i18nPh); });
    document.documentElement.lang = UI;
    document.title = t("app.title");
  }
  function setUiLang(code){
    if (!I18N[code]) return;
    UI = code;
    try{ localStorage.setItem(LANG_KEY, code); }catch(e){}
    $("uiLang").value = code;
    applyI18n();
    if (state.items.length){
      updateEnBtn(); refreshMeter(); renderSectionJumps();
      $("diffName").textContent = state.diffOther ? t("diff.fileInfo", {name: state.diffOther.name, n: state.diffOther.lines.length}) : "";
      setView(state.view);
    }
  }

  // Strip download-duplication artifacts ("ru_1_.lang", "ru (1).lang") without
  // touching real locale codes like pt-BR, zh-CN or es-419.
  function cleanName(name){
    let base = String(name || "ru.lang").replace(/\.lang$/i, "");
    base = base.replace(/\s*\(\d+\)\s*$/, "");   // "ru (1)" -> "ru"
    base = base.replace(/_\d+_?/g, "");           // "ru_1_" / "ru_1" -> "ru"  (locales never use "_")
    base = base.replace(/^_+|_+$/g, "");
    return (base || "ru") + ".lang";
  }

  const state = {
    filename: "ru.lang",
    eol: "\r\n",
    items: [],          // parsed lines in order
    filter: "missing",
    query: "",
    saveTimer: null,
    // machine-translation / spellcheck
    spellcheck: true,
    mtProvider: "google",
    targetLang: "ru",
    byId: new Map(),
    savedAt: 0,
    view: "editor",
    reviewFilter: "all",
    reviewQuery: "",
    acEnabled: true,
    enFilename: "",
    diffOther: null,   // {name, lines[]}
    diffOnly: true,    // collapse equal runs
  };

  // ---------- parsing ----------
  function classifyLine(line){
    const t = line.trim();
    if (t === "") return {type:"blank", raw:line};
    if (t.startsWith("//")) return {type:"comment", raw:line};
    if (/^\[.*\]$/.test(t)) return {type:"section", raw:line, name:t};
    return {type:"comment", raw:line};   // passthrough for anything without "="
  }
  function parse(text){
    const eol = text.includes("\r\n") ? "\r\n" : "\n";
    const lines = text.split(/\r\n|\n/);
    const items = lines.map((line, idx) => {
      const t = line.trim();
      if (t === "" || t.startsWith("//") || /^\[.*\]$/.test(t)) return classifyLine(line);
      let pfx = "none", body = line;
      if (line.startsWith(MISS)) { pfx="missing"; body=line.slice(MISS.length); }
      else if (line.startsWith(SAME)) { pfx="same"; body=line.slice(SAME.length); }
      const eq = body.indexOf("=");
      if (eq < 0) return classifyLine(line);
      const key = body.slice(0, eq);
      const english = body.slice(eq+1);       // original value (English for missing)
      // working value: for missing -> prefill with english so tokens are preserved; else the existing value
      return {
        type:"entry", id:idx, key, english,
        value: english,                        // current translation text
        markedSame: pfx === "same",
        wasMissing: pfx === "missing",
        touched: false,                        // user changed it in this workspace
      };
    });
    return {eol, items};
  }

  // derived status: "missing" | "done" | "same"
  function statusOf(e){
    if (e.markedSame) return "same";
    if (e.wasMissing){
      if (e.value.trim() === "" || e.value === e.english) return "missing";
      return "done";
    }
    // originally translated line
    if (e.value.trim() === "") return "missing";
    return "done";
  }

  function tokensOf(str){
    const m = str.match(TOKEN_RE);
    return m ? m : [];
  }
  function tokClass(tok){
    if (tok.startsWith("<")) return "var";
    if (tok.startsWith("[")) return "ref";
    if (tok.startsWith("§")) return "fmt";
    return "nl"; // \n
  }
  // tokens present in english but missing from translation (multiset-aware)
  function missingTokens(e){
    const src = tokensOf(baseEN(e));
    if (!src.length) return [];
    const have = tokensOf(e.value);
    const pool = have.slice();
    const miss = [];
    for (const tk of src){
      const i = pool.indexOf(tk);
      if (i === -1) miss.push(tk); else pool.splice(i,1);
    }
    // unique preserve order
    return [...new Set(miss)];
  }

  const esc = s => s.replace(/[&<>]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

  // ---------- whitespace anomalies ----------
  const RE_LEAD = /^[ \t\u00A0]+/, RE_TRAIL = /[ \t\u00A0]+$/, RE_DBL = / {2,}/;
  const RE_WS_ANY = /^[ \t\u00A0]|[ \t\u00A0]$|[\t\u00A0]| {2}/;
  // runs to highlight: leading, trailing, any tab/nbsp, inner double spaces
  const RE_WS_RUN = /^[ \t\u00A0]+|[ \t\u00A0]+$|[\t\u00A0]+| {2,}/g;
  function wsGlyphs(s){
    return s.replace(/ /g,"·").replace(/\t/g,"⇥").replace(/\u00A0/g,"⍽");
  }
  function wsMark(s){ return s ? `<span class="ws">${wsGlyphs(s)}</span>` : ""; }
  // escape + make runs of 2+ spaces visible
  function escWS(s){
    return esc(s).replace(/ {2,}/g, m => `<span class="ws">${"·".repeat(m.length)}</span>`)
                 .replace(/\t/g, `<span class="ws">⇥</span>`)
                 .replace(/\u00A0/g, `<span class="ws">⍽</span>`);
  }
  // Overlay markup for a textarea: keeps the ORIGINAL characters (so widths line up
  // with the textarea on top) and only paints backgrounds behind whitespace runs.
  function wsOverlayHTML(v){
    let out = "", last = 0, m;
    RE_WS_RUN.lastIndex = 0;
    while ((m = RE_WS_RUN.exec(v)) !== null){
      if (m[0] === ""){ RE_WS_RUN.lastIndex++; continue; }
      out += esc(v.slice(last, m.index));
      out += `<span class="wsb">${esc(m[0])}</span>`;
      last = m.index + m[0].length;
    }
    out += esc(v.slice(last));
    return out + "\n";   // trailing newline keeps the last line's height stable
  }
  // Flags whitespace in the translation that the English source doesn't have.
  function wsScan(e){
    const v = e.value, en = sourceEN(e);
    const lead  = RE_LEAD.test(v)  && !(en != null && RE_LEAD.test(en));
    const trail = RE_TRAIL.test(v) && !(en != null && RE_TRAIL.test(en));
    const core  = v.replace(RE_LEAD,"").replace(RE_TRAIL,"");
    const enCore = en != null ? en.replace(RE_LEAD,"").replace(RE_TRAIL,"") : null;
    const dbl   = RE_DBL.test(core) && !(enCore != null && RE_DBL.test(enCore));
    const tab   = v.includes("\t") && !(en != null && en.includes("\t"));
    const nbsp  = v.includes("\u00A0") && !(en != null && en.includes("\u00A0"));
    return {lead, trail, dbl, tab, nbsp, any: lead||trail||dbl||tab||nbsp};
  }
  function wsLabel(w){
    const p = [];
    if (w.lead)  p.push(t("ws.lead"));
    if (w.trail) p.push(t("ws.trail"));
    if (w.dbl)   p.push(t("ws.dbl"));
    if (w.tab)   p.push(t("ws.tab"));
    if (w.nbsp)  p.push(t("ws.nbsp"));
    return p.join(", ");
  }
  // normalize: strip stray edges, collapse doubles, keep the English source's own edges
  function wsFix(e){
    const en = sourceEN(e);
    let v = e.value.replace(/\t/g," ").replace(/\u00A0/g," ")
                   .replace(RE_LEAD,"").replace(RE_TRAIL,"")
                   .replace(/ {2,}/g," ");
    if (en != null){
      v = ((en.match(RE_LEAD)||[""])[0]) + v + ((en.match(RE_TRAIL)||[""])[0]);
    }
    return v;
  }
  function wsCount(){
    let n = 0;
    for (const e of state.items) if (e.type==="entry" && wsScan(e).any) n++;
    return n;
  }
  function highlight(str){
    const lead = (str.match(RE_LEAD)||[""])[0];
    const trail = lead.length === str.length ? "" : (str.match(RE_TRAIL)||[""])[0];
    const body = str.slice(lead.length, str.length - trail.length);
    let out = "", last = 0, m;
    TOKEN_RE.lastIndex = 0;
    while ((m = TOKEN_RE.exec(body)) !== null){
      out += escWS(body.slice(last, m.index));
      const tk = m[0];
      out += `<span class="t-${tokClass(tk)}">${esc(tk)}</span>`;
      last = m.index + tk.length;
    }
    out += escWS(body.slice(last));
    return wsMark(lead) + out + wsMark(trail);
  }

  // English source for an entry: en.lang reference if loaded, else the English
  // that shipped inline for MISSING entries. null when no English is available.
  function sourceEN(e){ return (e.ref != null) ? e.ref : (e.wasMissing ? e.english : null); }
  function baseEN(e){ const s = sourceEN(e); return s != null ? s : e.english; }

  function parseEnLang(text){
    const map = new Map();
    for (const raw of text.split(/\r\n|\n/)){
      const t = raw.trim();
      if (t==="" || t.startsWith("//") || /^\[.*\]$/.test(t)) continue;
      let body = raw;
      if (body.startsWith(MISS)) body = body.slice(MISS.length);
      else if (body.startsWith(SAME)) body = body.slice(SAME.length);
      const eq = body.indexOf("="); if (eq < 0) continue;
      map.set(body.slice(0, eq), body.slice(eq+1));
    }
    return map;
  }
  function applyEnRef(map){
    let matched = 0;
    for (const e of state.items){
      if (e.type !== "entry") continue;
      const r = map.get(e.key);
      if (r != null){ e.ref = r; matched++; }
    }
    return matched;
  }
  function updateEnBtn(){
    const b = $("btnEnRef"); if (!b) return;
    if (state.enFilename){
      const n = state.items.filter(e => e.type==="entry" && e.ref != null).length;
      b.textContent = t("btn.enRefLoaded", {n});
      b.classList.add("okbtn");
      b.title = t("btn.enRefLoadedTitle", {file: state.enFilename, n});
    } else {
      b.textContent = t("btn.enRef");
      b.title = t("btn.enRefTitle");
      b.classList.remove("okbtn");
    }
  }

  // ---------- counts + progress ----------
  function counts(){
    let missing=0, done=0, same=0, total=0, missBase=0, missDone=0, touched=0;
    for (const it of state.items){
      if (it.type !== "entry") continue;
      total++;
      if (it.touched) touched++;
      const s = statusOf(it);
      if (s==="missing") missing++; else if (s==="same") same++; else done++;
      if (it.wasMissing){ missBase++; if (s!=="missing") missDone++; }
    }
    return {missing, done, same, total, missBase, missDone, touched};
  }
  function refreshMeter(){
    const c = counts();
    $("c-missing").textContent = c.missing;
    $("c-done").textContent = c.done;
    $("c-same").textContent = c.same;
    $("c-all").textContent = c.total;
    const ws = wsCount();
    $("c-ws").textContent = ws;
    const wsBtn = document.querySelector('.filt[data-f="ws"]');
    if (wsBtn) wsBtn.classList.toggle("warn", ws > 0);
    const pct = c.missBase ? Math.round(c.missDone / c.missBase * 100) : 100;
    $("fill").style.width = pct + "%";
    $("pct").innerHTML = `<b>${c.missDone}</b> / ${c.missBase} &nbsp;(${pct}%)`;
    $("footnote").innerHTML =
      esc(t("footnote.main", {file: state.filename, total: c.total, missing: c.missing})) +
      (c.same ? esc(t("footnote.same", {n: c.same})) : "") +
      (ws ? `<span style="color:var(--warn)">${esc(t("footnote.ws", {n: ws}))}</span>` : "");
    const trc = $("tabReviewCount"); if (trc) trc.textContent = c.touched;
    if (state.view === "review") updateReviewCounts();
  }

  // ---------- render list ----------
  function matchFilter(e){
    const s = statusOf(e);
    if (state.filter === "all") { /* pass */ }
    else if (state.filter === "ws") { if (!wsScan(e).any) return false; }
    else if (state.filter === "missing" && s !== "missing") return false;
    else if (state.filter === "done" && s !== "done") return false;
    else if (state.filter === "same" && s !== "same") return false;
    if (state.query){
      const q = state.query.toLowerCase();
      if (!e.key.toLowerCase().includes(q) &&
          !e.english.toLowerCase().includes(q) &&
          !e.value.toLowerCase().includes(q)) return false;
    }
    return true;
  }

  function renderList(){
    AC.hide();
    const list = $("list");
    list.innerHTML = "";
    let curSection = null, shown = 0, frag = document.createDocumentFragment();

    // walk items in order, inserting section headers before their entries
    let pendingSection = null;
    for (const it of state.items){
      if (it.type === "section"){ pendingSection = it.name; continue; }
      if (it.type !== "entry") continue;
      if (!matchFilter(it)) continue;
      if (pendingSection && pendingSection !== curSection){
        const h = document.createElement("div");
        h.className = "sec-head";
        h.textContent = pendingSection.replace(/^\[|\]$/g,"");
        frag.appendChild(h);
        curSection = pendingSection;
      } else if (pendingSection === null && curSection === null){
        // entries before any section
      }
      pendingSection = curSection; // keep header sticky until next section
      frag.appendChild(buildCard(it));
      shown++;
    }

    if (shown === 0){
      const d = document.createElement("div");
      d.style.cssText = "text-align:center;color:var(--ink-faint);padding:60px 20px;font-size:14px";
      d.textContent = state.query ? t("empty.noMatch") :
        (state.filter === "missing" ? t("empty.allDone") :
         state.filter === "ws" ? t("empty.noWs") : t("empty.generic"));
      frag.appendChild(d);
    }
    list.appendChild(frag);
    list.scrollTop = 0;
  }

  function buildCard(e){
    const card = document.createElement("div");
    const s = statusOf(e);
    card.className = "card st-" + s;
    card.dataset.key = e.key;
    card.dataset.idx = e.id;

    // row1
    const r1 = document.createElement("div"); r1.className = "row1";
    const key = document.createElement("button");
    key.className = "key"; key.textContent = e.key; key.title = t("card.copyKey");
    key.onclick = () => { navigator.clipboard?.writeText(e.key); toast(t("toast.keyCopied")); };
    const badge = document.createElement("span");
    badge.className = "badge " + (s==="missing"?"b-missing":s==="same"?"b-same":"b-done");
    badge.textContent = s==="missing"?t("badge.missing"):s==="same"?t("badge.same"):t("badge.done");
    const mtBadge = document.createElement("span");
    mtBadge.className = "badge b-mt" + (e.mtDraft && s==="done" ? " on" : "");
    mtBadge.textContent = t("badge.mt");
    r1.appendChild(key); r1.appendChild(badge); r1.appendChild(mtBadge);
    r1.appendChild(Object.assign(document.createElement("div"),{className:"spacer"}));
    card.appendChild(r1);

    // original (English reference from en.lang, or inline English for missing entries)
    const en = sourceEN(e);
    if (en != null){
      const orig = document.createElement("div"); orig.className = "orig";
      orig.innerHTML = `<span class="olabel">${esc(t("card.enOriginal"))}</span>${highlight(en)}`;
      card.appendChild(orig);
    }

    // textarea + whitespace overlay
    const {wrap, ta} = makeTextarea(false);
    ta.className = "tr"; ta.value = e.value; ta.rows = 1;
    ta.spellcheck = state.spellcheck; ta.lang = state.targetLang || "ru";
    autosize(ta); syncWs(ta);
    ta.addEventListener("input", () => {
      e.value = ta.value; e.mtDraft = false; e.touched = true; autosize(ta); syncWs(ta);
      updateCard(card, e); refreshMeter(); scheduleSave();
    });
    ta.addEventListener("keydown", ev => {
      if ((ev.ctrlKey||ev.metaKey) && ev.key === "Enter"){
        ev.preventDefault(); focusNextMissing(card);
      }
    });
    card.appendChild(wrap);

    // row3: tokens + same toggle + warnings
    const r3 = document.createElement("div"); r3.className = "row3";
    r3.dataset.role = "tokens";
    card.appendChild(r3);
    renderTokens(r3, e, ta, card);

    return card;
  }

  function renderTokens(r3, e, ta, card){
    r3.innerHTML = "";
    const toks = [...new Set(tokensOf(baseEN(e)))];
    const miss = new Set(missingTokens(e));
    if (toks.length){
      const lead = document.createElement("span"); lead.className="toklead"; lead.textContent=t("tokens.label");
      r3.appendChild(lead);
      for (const tk of toks){
        const c = document.createElement("button");
        const cls = tokClass(tk);
        c.className = "chip " + cls + (miss.has(tk) ? " miss" : "");
        c.textContent = tk;
        c.title = miss.has(tk) ? t("tokens.insertMissing") : t("tokens.insert");
        c.onclick = () => { insertAtCursor(ta, tk); e.value = ta.value; e.touched = true; autosize(ta); updateCard(card,e); refreshMeter(); scheduleSave(); };
        r3.appendChild(c);
      }
    }
    // machine-translation button
    const mt = document.createElement("button");
    mt.className = "mtbtn";
    mt.innerHTML = `<span class="sp2"></span>${esc(t("mt.btn"))}`;
    mt.title = t("mt.btnTitle");
    mt.onclick = () => translateEntry(e, ta, card, mt);
    r3.appendChild(mt);
    // whitespace warning + one-click fix
    const w = wsScan(e);
    if (w.any){
      const fix = document.createElement("button");
      fix.className = "chip wsfix";
      fix.textContent = "⚠ " + wsLabel(w);
      fix.title = t("ws.fixTitle");
      fix.onclick = () => {
        e.value = wsFix(e); e.touched = true; ta.value = e.value; autosize(ta); syncWs(ta);
        updateCard(card, e); refreshMeter(); scheduleSave(); toast(t("toast.wsFixed"));
      };
      r3.appendChild(fix);
    }
    // same-as-english toggle
    const sb = document.createElement("button");
    sb.className = "samebtn" + (e.markedSame ? " on" : "");
    sb.textContent = e.markedSame ? t("same.on") : t("same.off");
    sb.title = t("same.title");
    sb.onclick = () => {
      e.markedSame = !e.markedSame; e.touched = true;
      if (e.markedSame && e.value.trim()===""){ e.value = e.english; ta.value = e.english; autosize(ta); syncWs(ta); }
      updateCard(card, e); refreshMeter(); scheduleSave();
    };
    r3.appendChild(sb);
  }

  function updateCard(card, e){
    const s = statusOf(e);
    card.className = "card st-" + s;
    const badge = card.querySelector(".badge:not(.b-mt)");
    if (badge){
      badge.className = "badge " + (s==="missing"?"b-missing":s==="same"?"b-same":"b-done");
      badge.textContent = s==="missing"?t("badge.missing"):s==="same"?t("badge.same"):t("badge.done");
    }
    const mtBadge = card.querySelector(".b-mt");
    if (mtBadge) mtBadge.classList.toggle("on", !!e.mtDraft && s==="done");
    const r3 = card.querySelector('[data-role="tokens"]');
    const ta = card.querySelector("textarea");
    if (r3 && ta) renderTokens(r3, e, ta, card);
  }

  function focusNextMissing(fromCard){
    let n = fromCard.nextElementSibling;
    while (n && !(n.classList && n.classList.contains("card") && n.classList.contains("st-missing"))) n = n.nextElementSibling;
    if (n){ const ta = n.querySelector("textarea"); ta.focus(); ta.setSelectionRange(ta.value.length, ta.value.length); n.scrollIntoView({block:"center"}); }
    else toast(t("toast.noMoreMissing"));
  }

  function insertAtCursor(ta, text){
    const s = ta.selectionStart ?? ta.value.length, en = ta.selectionEnd ?? ta.value.length;
    ta.value = ta.value.slice(0,s) + text + ta.value.slice(en);
    ta.focus(); const p = s + text.length; ta.setSelectionRange(p,p);
    syncWs(ta);
  }
  function autosize(ta){ ta.style.height="auto"; ta.style.height = Math.min(ta.scrollHeight, 260) + "px"; }

  // Wrap a textarea so whitespace can be painted behind it, and keep them in sync.
  function makeTextarea(review){
    const wrap = document.createElement("div");
    wrap.className = "tawrap" + (review ? " rv" : "");
    const ta = document.createElement("textarea");
    wrap.appendChild(ta);
    ta.addEventListener("scroll", () => {
      const b = wrap.querySelector(".wsback");
      if (b) b.scrollTop = ta.scrollTop;
    });
    return {wrap, ta};
  }
  function syncWs(ta){
    const wrap = ta.parentNode;
    if (!wrap || !wrap.classList || !wrap.classList.contains("tawrap")) return;
    let back = wrap.querySelector(".wsback");
    if (!RE_WS_ANY.test(ta.value)){ if (back) back.remove(); return; }
    if (!back){
      back = document.createElement("div");
      back.className = "wsback";
      back.setAttribute("aria-hidden","true");
      wrap.insertBefore(back, ta);
    }
    back.innerHTML = wsOverlayHTML(ta.value);
    back.scrollTop = ta.scrollTop;
  }

  // ---------- review view ----------
  function extraTokens(e){
    const src = tokensOf(baseEN(e)), have = tokensOf(e.value);
    const pool = src.slice(), extra = [];
    for (const tk of have){ const i = pool.indexOf(tk); if (i===-1) extra.push(tk); else pool.splice(i,1); }
    return [...new Set(extra)];
  }
  function computeReview(e){
    const s = statusOf(e);
    const miss = missingTokens(e);
    const extra = extraTokens(e);
    const enRef = sourceEN(e);
    const sameEng = (s==="done" && e.value.trim()!=="" && e.value === (enRef != null ? enRef : e.english));
    const empty = (s==="missing");            // touched but not actually translated (cleared / MT echoed english)
    const mt = !!e.mtDraft && s==="done";
    const ws = wsScan(e);
    const flagged = miss.length>0 || extra.length>0 || sameEng || empty || ws.any;
    return {s, miss, extra, sameEng, empty, mt, ws, flagged};
  }
  function reviewMatch(e){
    if (!e.touched) return false;             // only strings changed in this workspace
    const c = computeReview(e);
    if (state.reviewFilter==="mt" && !c.mt) return false;
    if (state.reviewFilter==="issues" && !c.flagged) return false;
    if (state.reviewFilter==="same" && !c.sameEng) return false;
    if (state.reviewQuery){
      const q = state.reviewQuery.toLowerCase();
      if (!e.key.toLowerCase().includes(q) && !e.english.toLowerCase().includes(q) && !e.value.toLowerCase().includes(q)) return false;
    }
    return true;
  }
  function reviewStats(){
    let all=0, mt=0, issues=0, same=0;
    for (const e of state.items){
      if (e.type!=="entry" || !e.touched) continue;
      all++;
      const c = computeReview(e);
      if (c.mt) mt++;
      if (c.flagged) issues++;
      if (c.sameEng) same++;
    }
    return {all, mt, issues, same};
  }
  function updateReviewCounts(){
    const st = reviewStats();
    $("rc-all").textContent = st.all; $("rc-mt").textContent = st.mt;
    $("rc-issues").textContent = st.issues; $("rc-same").textContent = st.same;
  }

  function flagNodes(c){
    const nodes = [];
    if (c.empty){ const b=document.createElement("span"); b.className="rflag miss"; b.textContent=t("rflag.notTranslated"); nodes.push(b); }
    if (c.mt){ const b=document.createElement("span"); b.className="rflag mt"; b.textContent=t("badge.mt"); nodes.push(b); }
    if (c.miss.length){ const b=document.createElement("span"); b.className="rflag miss"; b.textContent=t("rflag.token",{list:c.miss.join(" ")}); nodes.push(b); }
    if (c.extra.length){ const b=document.createElement("span"); b.className="rflag miss"; b.textContent=t("rflag.extra",{list:c.extra.join(" ")}); nodes.push(b); }
    if (c.sameEng){ const b=document.createElement("span"); b.className="rflag same"; b.textContent=t("rflag.sameEng"); nodes.push(b); }
    if (c.ws && c.ws.any){ const b=document.createElement("span"); b.className="rflag ws"; b.textContent=t("rflag.ws",{list:wsLabel(c.ws)}); nodes.push(b); }
    return nodes;
  }

  function buildReviewRow(e){
    const c = computeReview(e);
    const row = document.createElement("div");
    row.className = "rrow " + (c.flagged ? "flag" : c.mt ? "mt" : "");
    row.dataset.idx = e.id;

    // meta
    const meta = document.createElement("div"); meta.className = "rmeta";
    const key = document.createElement("button"); key.className="rkey"; key.textContent=e.key; key.title=t("card.copyKey");
    key.onclick = () => { navigator.clipboard?.writeText(e.key); toast(t("toast.keyCopied")); };
    const flags = document.createElement("div"); flags.className="rflags"; flags.dataset.role="rflags";
    flagNodes(c).forEach(n=>flags.appendChild(n));
    meta.appendChild(key); meta.appendChild(flags);

    // english
    const en = document.createElement("div"); en.className="rcol";
    const enSrc = sourceEN(e);
    en.innerHTML = `<span class="rlabel">${esc(t("review.enLabel"))}</span>` + (enSrc != null
      ? `<div class="ren">${highlight(enSrc)}</div>`
      : `<div class="ren empty-ref">${esc(t("review.noRef"))}</div>`);

    // translation (editable)
    const ru = document.createElement("div"); ru.className="rcol rru";
    const lbl = document.createElement("span"); lbl.className="rlabel"; lbl.textContent=t("review.trLabel");
    const {wrap: taWrap, ta} = makeTextarea(true);
    ta.value = e.value; ta.spellcheck = state.spellcheck; ta.lang = state.targetLang || "ru";
    autosize(ta); syncWs(ta);
    const miss = document.createElement("div"); miss.className="rmiss"; miss.dataset.role="rmiss";
    renderReviewMiss(miss, e, ta, row);
    ta.addEventListener("input", () => {
      e.value = ta.value; e.mtDraft = false; e.touched = true; autosize(ta); syncWs(ta);
      updateReviewRow(row, e); refreshMeter(); updateReviewCounts(); scheduleSave();
    });
    ru.appendChild(lbl); ru.appendChild(taWrap); ru.appendChild(miss);

    // actions
    const act = document.createElement("div"); act.className="ractions";
    const edit = document.createElement("button"); edit.className="rbtn"; edit.textContent=t("review.edit");
    edit.title = t("review.editTitle");
    edit.onclick = () => jumpToEditor(e);
    act.appendChild(edit);
    if (c.mt){
      const ok = document.createElement("button"); ok.className="rbtn ok"; ok.textContent=t("review.checked");
      ok.title = t("review.checkedTitle");
      ok.onclick = () => { e.mtDraft = false; refreshReviewRow(e); refreshMeter(); updateReviewCounts(); scheduleSave(); };
      act.appendChild(ok);
    }
    if (c.ws.any){
      const fx = document.createElement("button"); fx.className="rbtn"; fx.textContent=t("review.wsFix");
      fx.title = t("review.wsFixTitle", {list: wsLabel(c.ws)});
      fx.onclick = () => {
        e.value = wsFix(e); e.touched = true;
        refreshReviewRow(e); refreshMeter(); updateReviewCounts(); scheduleSave(); toast(t("toast.wsFixed"));
      };
      act.appendChild(fx);
    }

    row.appendChild(meta); row.appendChild(en); row.appendChild(ru); row.appendChild(act);
    return row;
  }

  function renderReviewMiss(box, e, ta, row){
    box.innerHTML = "";
    const miss = missingTokens(e);
    for (const tk of miss){
      const chip = document.createElement("button");
      chip.className = "chip miss " + tokClass(tk);
      chip.textContent = tk;
      chip.title = t("tokens.insertMissing");
      chip.onclick = () => { insertAtCursor(ta, tk); e.value = ta.value; e.touched = true; autosize(ta); updateReviewRow(row, e); refreshMeter(); updateReviewCounts(); scheduleSave(); };
      box.appendChild(chip);
    }
  }
  // update flags/class/miss in place, without touching the textarea (keeps focus)
  function updateReviewRow(row, e){
    const c = computeReview(e);
    row.className = "rrow " + (c.flagged ? "flag" : c.mt ? "mt" : "");
    const flags = row.querySelector('[data-role="rflags"]');
    if (flags){ flags.innerHTML=""; flagNodes(c).forEach(n=>flags.appendChild(n)); }
    const miss = row.querySelector('[data-role="rmiss"]');
    const ta = row.querySelector("textarea");
    if (miss && ta) renderReviewMiss(miss, e, ta, row);
  }

  // ---------- text diff (line-based, like a code editor) ----------
  // Keys can change between versions, so this compares raw lines, not key→value pairs.
  function lcsPairs(a,b,i1,i2,j1,j2){
    const n=i2-i1, m=j2-j1;
    if (n<=0 || m<=0) return [];
    const w=m+1, dp=new Uint32Array((n+1)*w);
    for (let i=n-1;i>=0;i--){
      const row=i*w, next=(i+1)*w;
      for (let j=m-1;j>=0;j--){
        dp[row+j] = (a[i1+i]===b[j1+j]) ? dp[next+j+1]+1
                  : Math.max(dp[next+j], dp[row+j+1]);
      }
    }
    const out=[]; let i=0,j=0;
    while (i<n && j<m){
      if (a[i1+i]===b[j1+j]){ out.push([i1+i, j1+j]); i++; j++; }
      else if (dp[(i+1)*w+j] >= dp[i*w+j+1]) i++;
      else j++;
    }
    return out;
  }
  // patience anchors: lines occurring exactly once on both sides
  function patienceAnchors(a,b,i1,i2,j1,j2){
    const ca=new Map(), cb=new Map();
    for (let i=i1;i<i2;i++) ca.set(a[i],(ca.get(a[i])||0)+1);
    for (let j=j1;j<j2;j++) cb.set(b[j],(cb.get(b[j])||0)+1);
    const posB=new Map();
    for (let j=j1;j<j2;j++) if (cb.get(b[j])===1) posB.set(b[j], j);
    const cand=[];
    for (let i=i1;i<i2;i++){ const v=a[i]; if (ca.get(v)===1 && posB.has(v)) cand.push([i, posB.get(v)]); }
    if (!cand.length) return [];
    // longest increasing subsequence on the b-index
    const tails=[], idx=[], prev=new Array(cand.length).fill(-1);
    for (let k=0;k<cand.length;k++){
      const v=cand[k][1];
      let lo=0, hi=tails.length;
      while (lo<hi){ const mid=(lo+hi)>>1; if (tails[mid]<v) lo=mid+1; else hi=mid; }
      tails[lo]=v; idx[lo]=k; prev[k] = lo>0 ? idx[lo-1] : -1;
    }
    const res=[]; let k = tails.length ? idx[tails.length-1] : -1;
    while (k>=0){ res.push(cand[k]); k=prev[k]; }
    return res.reverse();
  }
  function collectMatches(a,b,i1,i2,j1,j2,depth,out){
    while (i1<i2 && j1<j2 && a[i1]===b[j1]){ out.push([i1,j1]); i1++; j1++; }
    const suffix=[];
    while (i1<i2 && j1<j2 && a[i2-1]===b[j2-1]){ i2--; j2--; suffix.push([i2,j2]); }
    if (i1<i2 && j1<j2){
      const anchors = depth<24 ? patienceAnchors(a,b,i1,i2,j1,j2) : [];
      if (anchors.length){
        let ci=i1, cj=j1;
        for (const [ai,bj] of anchors){
          collectMatches(a,b,ci,ai,cj,bj,depth+1,out);
          out.push([ai,bj]); ci=ai+1; cj=bj+1;
        }
        collectMatches(a,b,ci,i2,cj,j2,depth+1,out);
      } else if ((i2-i1)*(j2-j1) <= 1500000){
        for (const p of lcsPairs(a,b,i1,i2,j1,j2)) out.push(p);
      }
      // else: region too large without anchors -> treated as a replaced block
    }
    for (let k=suffix.length-1;k>=0;k--) out.push(suffix[k]);
  }

  // build side-by-side rows: {k:'eq'|'chg'|'del'|'add', li, ri}
  function diffRows(a,b){
    const matches=[]; collectMatches(a,b,0,a.length,0,b.length,0,matches);
    const rows=[]; let ai=0, bi=0;
    const flushGap = (ae,be) => {
      const dl=ae-ai, al=be-bi, n=Math.max(dl,al);
      for (let k=0;k<n;k++){
        const hasL=k<dl, hasR=k<al;
        rows.push({k: hasL&&hasR ? "chg" : hasL ? "del" : "add",
                   li: hasL ? ai+k : -1, ri: hasR ? bi+k : -1});
      }
      ai=ae; bi=be;
    };
    for (const [x,y] of matches){
      if (x>ai || y>bi) flushGap(x,y);
      rows.push({k:"eq", li:x, ri:y}); ai=x+1; bi=y+1;
    }
    if (ai<a.length || bi<b.length) flushGap(a.length, b.length);
    return rows;
  }

  // word-level highlight inside a changed pair
  function inlineDiff(l,r){
    const A=l.match(/\s+|\S+/g)||[], B=r.match(/\s+|\S+/g)||[];
    if (A.length*B.length > 60000) return [esc(l), esc(r)];
    const pairs=lcsPairs(A,B,0,A.length,0,B.length);
    let ai=0, bi=0, lh="", rh="";
    for (const [x,y] of pairs){
      if (ai<x) lh += `<span class="di-del">${esc(A.slice(ai,x).join(""))}</span>`;
      if (bi<y) rh += `<span class="di-add">${esc(B.slice(bi,y).join(""))}</span>`;
      lh += esc(A[x]); rh += esc(B[y]); ai=x+1; bi=y+1;
    }
    if (ai<A.length) lh += `<span class="di-del">${esc(A.slice(ai).join(""))}</span>`;
    if (bi<B.length) rh += `<span class="di-add">${esc(B.slice(bi).join(""))}</span>`;
    return [lh||"&nbsp;", rh||"&nbsp;"];
  }

  function renderDiff(){
    AC.hide();
    const box=$("difflist");
    if (!state.diffOther){
      box.innerHTML = `<div class="empty-d">${t("diff.empty")}</div>`;
      $("diffStat").textContent = "";
      return;
    }
    const A=state.diffOther.lines, B=buildLang().split(/\r\n|\n/);
    const rows=diffRows(A,B);
    let add=0, del=0, chg=0;
    for (const r of rows){ if (r.k==="add") add++; else if (r.k==="del") del++; else if (r.k==="chg") chg++; }
    $("diffStat").innerHTML = `<span class="del">−${del}</span> · <span class="chg">~${chg}</span> · <span class="add">+${add}</span> ${esc(t("diff.stat",{total:rows.length}))}`;

    // collapse long equal runs when "only differences" is on
    let show=rows.map(()=>true);
    if (state.diffOnly){
      const CTX=3;
      show=rows.map(()=>false);
      rows.forEach((r,i)=>{
        if (r.k==="eq") return;
        for (let j=Math.max(0,i-CTX); j<=Math.min(rows.length-1,i+CTX); j++) show[j]=true;
      });
    }

    const cell=(t)=> t==="" ? "&nbsp;" : esc(t);
    const parts=[`<div class="dhead"><div>${esc(t("diff.headLine"))}</div><div>${esc(state.diffOther.name)}</div><div class="h2">${esc(t("diff.headLine"))}</div><div>${esc(t("diff.headCurrent"))}</div></div>`];
    let hidden=0;
    const flushHidden=()=>{ if (hidden){ parts.push(`<div class="dgap">${esc(t("diff.gap",{n:hidden}))}</div>`); hidden=0; } };
    for (let i=0;i<rows.length;i++){
      if (!show[i]){ hidden++; continue; }
      flushHidden();
      const r=rows[i];
      const lt=r.li>=0?A[r.li]:"", rt=r.ri>=0?B[r.ri]:"";
      let lh, rh;
      if (r.k==="chg") [lh,rh]=inlineDiff(lt,rt);
      else { lh=r.li>=0?cell(lt):""; rh=r.ri>=0?cell(rt):""; }
      parts.push(
        `<div class="drow ${r.k}">`+
        `<div class="dnum dnum-l">${r.li>=0?r.li+1:""}</div>`+
        `<div class="dtxt txt-l">${lh}</div>`+
        `<div class="dnum dnum-r side2">${r.ri>=0?r.ri+1:""}</div>`+
        `<div class="dtxt txt-r">${rh}</div>`+
        `</div>`);
    }
    flushHidden();
    if (state.diffOnly && !add && !del && !chg)
      parts.push(`<div class="empty-d">${esc(t("diff.identical"))}</div>`);
    box.innerHTML = parts.join("");
    box.scrollTop = 0;
  }

  // ---------- machine translation ----------
function targetFromName(name){ 
    let code = cleanName(name).replace(/\.lang$/i, "");
    return code || UI || "en"; 
  }
 function indexItems(){ state.byId = new Map(); for (const it of state.items) if (it.type==="entry") state.byId.set(it.id, it); }
  const sleep = ms => new Promise(r => setTimeout(r, ms));
  // Only these remain; sessions saved with a removed provider (e.g. mymemory) fall back.
  // Google only. Sessions saved with a provider that has since been removed
  // (mymemory, yandex, lingva) fall back to it on load.
  const MT_PROVIDERS = ["google"];
  function validProvider(p){ return MT_PROVIDERS.includes(p) ? p : MT_PROVIDERS[0]; }
  function decodeEntities(s){ const t = document.createElement("textarea"); t.innerHTML = s; return t.value; }

  // Necesse filenames use BCP-47-ish codes; Google's gtx endpoint wants its own set.
  // Also fix common typos (pr-BR → pt-BR: R is next to T on QWERTY).
  function normalizeMtLang(code){
    let c = String(code || "").trim().replace(/_/g, "-");
    if (!c) return "ru";
    if (/^pr(-br)?$/i.test(c)) c = "pt" + c.slice(2);
    const aliases = {
      "pt-br": "pt", "pt-pt": "pt",
      "zh-cn": "zh-CN", "zh-tw": "zh-TW", "zh-hk": "zh-TW",
      "es-419": "es", "es-es": "es", "es-mx": "es",
      "en-us": "en", "en-gb": "en",
      "nb-no": "no", "nn-no": "no",
    };
    const hit = aliases[c.toLowerCase()];
    return hit || c;
  }
  // Prefer live input value so MT works even before blur/change fires.
  function currentTargetLang(){
    const live = (($("mtTarget") && $("mtTarget").value) || "").trim();
    if (live) state.targetLang = live;
    return state.targetLang || "ru";
  }

  // Replace format tokens with sentinels the MT engine should leave untouched,
  // then restore them afterwards. Dropped sentinels surface via the ⚠ chips.
  function maskTokens(str){
    const tokens = [];
    TOKEN_RE.lastIndex = 0;
    const masked = str.replace(TOKEN_RE, m => { const i = tokens.length; tokens.push(m); return "⟦"+i+"⟧"; });
    return {masked, tokens};
  }
  function restoreTokens(str, tokens){
    let out = str;
    tokens.forEach((tk,i) => { out = out.replace(new RegExp("⟦\\s*"+i+"\\s*⟧","g"), () => tk); });
    return out;
  }

  async function callProvider(provider, text, target){
    const ctl = new AbortController();
    const to = setTimeout(() => ctl.abort(), 13000);
    try{
      if (provider === "google"){
        const tl = normalizeMtLang(target);
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=${encodeURIComponent(tl)}&dt=t&q=${encodeURIComponent(text)}`;
        const r = await fetch(url, {signal:ctl.signal});
        if (!r.ok) throw new Error("Google "+r.status);
        const j = await r.json();
        const seg = j && j[0];
        if (!Array.isArray(seg)) throw new Error(t("mt.errGoogle"));
        return seg.map(s => (s && s[0]) ? s[0] : "").join("");
      }
      throw new Error(t("mt.errUnknownProvider"));
    } catch(err){
      if (err.name === "AbortError") throw new Error(t("mt.errTimeout"));
      if (err instanceof TypeError) throw new Error(t("mt.errNetwork"));
      throw err;
    } finally { clearTimeout(to); }
  }

  async function mtTranslate(text){
    if (!text.trim()) return "";
    const {masked, tokens} = maskTokens(text);
    const res = await callProvider(state.mtProvider, masked, currentTargetLang());
    return restoreTokens(res, tokens);
  }

  let mtBusy = false;
  async function translateEntry(e, ta, card, btn){
    if (btn.classList.contains("loading") || mtBusy) return;   // one request at a time
    // Must translate the English original (en.lang ref / missing inline), never the
    // already-translated e.english/e.value — that produced Russian→Russian with sl=en.
    const src = sourceEN(e);
    if (src == null){ toast(t("mt.needEnRef")); return; }
    if (!String(src).trim()){ toast(t("mt.emptySrc")); return; }
    mtBusy = true;
    btn.classList.add("loading"); btn.disabled = true;
    try{
      const sug = await mtTranslate(src);
      if (sug && sug.trim()){ e.value = sug; e.mtDraft = true; e.touched = true; ta.value = sug; autosize(ta); syncWs(ta); }
      updateCard(card, e); refreshMeter(); scheduleSave();
    } catch(err){ toast(t("mt.prefix", {msg: err.message || t("err.generic")})); }
    finally{ btn.classList.remove("loading"); btn.disabled = false; mtBusy = false; }
  }

  // ---------- export ----------
  function buildLang(){
    const out = [];
    for (const it of state.items){
      if (it.type !== "entry"){ out.push(it.raw); continue; }
      const s = statusOf(it);
      if (s === "missing") out.push(MISS + it.key + "=" + it.value);
      else if (s === "same") out.push(SAME + it.key + "=" + it.value);
      else out.push(it.key + "=" + it.value);
    }
    return out.join(state.eol);
  }
  function download(name, text, mime){
    const blob = new Blob([text], {type: mime||"text/plain;charset=utf-8"});
    downloadBlob(name, blob);
  }
  function downloadBlob(name, blob){
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 1000);
  }
  const canGzip = typeof CompressionStream !== "undefined";
  async function gzipBlob(text){
    const stream = new Blob([text]).stream().pipeThrough(new CompressionStream("gzip"));
    return await new Response(stream).blob();
  }
  async function gunzipText(buf){
    const stream = new Blob([buf]).stream().pipeThrough(new DecompressionStream("gzip"));
    return await new Response(stream).text();
  }
  function fmtBytes(n){
    return n >= 1048576 ? (n/1048576).toFixed(1)+t("bytes.mb")
         : n >= 1024    ? Math.round(n/1024)+t("bytes.kb") : n+t("bytes.b");
  }

  // ---------- persistence ----------
  // Compact format v2: single-letter top-level keys, entries as tuples, flags bit-packed,
  // redundant fields dropped (english when it equals value, non-entry lines stored as raw
  // strings and re-classified on load). ~3x smaller than v1, which matters for the
  // localStorage quota once an en.lang reference is attached.
  const F_SAME=1, F_MISSING=2, F_MT=4, F_TOUCHED=8;

  function serialize(){
    const i = state.items.map(it => {
      if (it.type !== "entry") return it.raw || "";
      let f = 0;
      if (it.markedSame) f |= F_SAME;
      if (it.wasMissing) f |= F_MISSING;
      if (it.mtDraft)    f |= F_MT;
      if (it.touched)    f |= F_TOUCHED;
      const row = [it.key, it.value, f];
      const needEng = it.english !== it.value;
      const hasRef  = it.ref != null;
      if (needEng || hasRef) row.push(needEng ? it.english : 0);
      if (hasRef) row.push(it.ref);
      return row;
    });
    return {
      v:2, f:state.filename, e:(state.eol === "\r\n" ? 1 : 0), s:Date.now(), n:state.enFilename || "",
      m:{p:state.mtProvider, t:state.targetLang, s:state.spellcheck?1:0, a:state.acEnabled?1:0},
      i
    };
  }

  function deserialize(data){
    if (!data || (data.v !== 2 && !data.items)) throw new Error(t("err.unknownFormat"));
    if (data.v === 2) return deserializeV2(data);
    return deserializeV1(data);
  }

  function deserializeV2(d){
    state.filename = d.f || "ru.lang";
    state.enFilename = d.n || "";
    state.eol = d.e ? "\r\n" : "\n";
    state.savedAt = d.s || 0;
    const m = d.m || {};
    state.mtProvider = validProvider(m.p || state.mtProvider);
    state.targetLang = m.t || targetFromName(state.filename);
    state.spellcheck = m.s !== 0;
    state.acEnabled = m.a !== 0;
    state.items = (d.i || []).map((row, idx) => {
      if (!Array.isArray(row)) return classifyLine(String(row));
      const [key, value, f, eng, ref] = row;
      const e = {type:"entry", id:idx, key, value,
                 english: (eng === 0 || eng === undefined) ? value : eng,
                 markedSame: !!(f & F_SAME), wasMissing: !!(f & F_MISSING),
                 mtDraft: !!(f & F_MT), touched: !!(f & F_TOUCHED)};
      if (ref != null) e.ref = ref;
      return e;
    });
  }

  // legacy verbose format
  function deserializeV1(data){
    state.filename = data.filename || "ru.lang";
    state.enFilename = data.enFilename || "";
    state.eol = data.eol || "\r\n";
    state.savedAt = data.savedAt || 0;
    if (data.mt){
      state.mtProvider = validProvider(data.mt.provider || state.mtProvider);
      state.targetLang = data.mt.target || targetFromName(state.filename);
      state.spellcheck = data.mt.spell !== false;
      state.acEnabled = data.mt.ac !== false;
    } else { state.targetLang = targetFromName(state.filename); }
    state.items = data.items.map((d,idx) => {
      if (d.t === "e") return {type:"entry", id:idx, key:d.key, english:d.english, value:d.value,
                               markedSame:!!d.markedSame, wasMissing:!!d.wasMissing,
                               mtDraft:!!d.mtDraft, touched:!!d.touched, ref:(d.ref != null ? d.ref : undefined)};
      return classifyLine(d.raw || "");
    });
  }
  function saveLS(){
