name: Apply encrypted provider secret vault

on:
  push:
    branches:
      - agent/encrypted-provider-secrets

permissions:
  contents: write

concurrency:
  group: encrypted-provider-secrets
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/encrypted-provider-secrets
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply integration
        run: node scripts/apply-secret-vault-integration.mjs

      - name: Verify
        run: npm run verify

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts test dist
          git diff --cached --quiet && exit 0
          git commit -m "Integrate encrypted provider secret vault"
          git push origin HEAD:agent/encrypted-provider-secrets
