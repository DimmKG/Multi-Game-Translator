name: Build locale assets

on:
  push:
    branches:
      - agent/split-built-in-locales

permissions:
  contents: write

jobs:
  build-locales:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate locale assets
        run: node scripts/generate-locale-assets.mjs
      - name: Validate generated assets
        run: |
          node -e "const fs=require('fs');const m=JSON.parse(fs.readFileSync('src/scripts/i18n/locales/manifest.json','utf8'));if(m.format!=='necesse-built-in-locales'||!Array.isArray(m.locales)||!m.locales.length)throw new Error('Invalid locale manifest');const b=fs.readFileSync('src/scripts/i18n/built-in-locales.generated.js','utf8');if(!b.includes('NecesseLocales.register')||!b.includes('GENERATED FILE'))throw new Error('Invalid runtime bundle');console.log('Validated '+m.locales.length+' generated locales')"
      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/i18n/locales/manifest.json src/scripts/i18n/built-in-locales.generated.js
          git diff --cached --quiet && exit 0
          git commit -m "Generate built-in locale assets"
          git push
