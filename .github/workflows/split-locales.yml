name: Integrate JSON locales

on:
  push:
    branches:
      - agent/split-built-in-locales

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Generate locale assets
        run: node scripts/generate-locale-assets.mjs
      - name: Integrate JSON locale runtime
        run: node scripts/integrate-json-locales.mjs
      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/index.html src/scripts/i18n scripts/build-standalone.mjs scripts/check-build.mjs
          git diff --cached --quiet && exit 0
          git commit -m "Integrate built-in JSON locales"
          git push
