name: Rebuild Settings locales

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/settings-locale-completion
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Rebuild locale bundle and standalone HTML
        run: npm run build

      - name: Verify project
        run: npm run verify

      - name: Commit generated assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/scripts/i18n/built-in-locales.generated.js src/scripts/i18n/locales/manifest.json dist/necesse-lang-translator.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild reviewed locale assets"
          git push origin HEAD:agent/settings-locale-completion
