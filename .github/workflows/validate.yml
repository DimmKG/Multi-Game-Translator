name: Validate project

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/token-aware-compare
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply token-aware Compare integration
        run: |
          node scripts/apply-token-aware-compare-integration.mjs
          node scripts/apply-token-aware-compare-fixes.mjs

      - name: Verify project and standalone build
        run: npm run verify

      - name: Commit Compare integration
        run: |
          git restore --source=HEAD -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-token-aware-compare-integration.mjs scripts/apply-token-aware-compare-fixes.mjs
          git add -A
          git commit -m "Integrate token-aware Compare UI"
          git push origin HEAD:agent/token-aware-compare
