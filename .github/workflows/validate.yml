name: Validate project

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/metadata-guidance
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Fix integration helper
        run: node scripts/fix-metadata-guidance-helper-v4.mjs

      - name: Apply metadata guidance integration
        run: node scripts/apply-metadata-guidance-integration.mjs

      - name: Verify project and standalone build
        run: npm run verify

      - name: Commit metadata guidance integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate contextual metadata guidance"
          git push origin HEAD:agent/metadata-guidance
