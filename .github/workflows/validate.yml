name: Validate project

on:
  push:
    branches:
      - main
      - "rewrite/**"
      - "agent/**"
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Show terminology Prettier diff
        run: |
          cp src/core/terminology/extract-candidates.ts /tmp/extract-candidates.before.ts
          npx prettier --write src/core/terminology/extract-candidates.ts
          diff -u /tmp/extract-candidates.before.ts src/core/terminology/extract-candidates.ts || true

      - name: Verify project
        run: npm run verify
