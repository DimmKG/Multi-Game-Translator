name: Validate project

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/compact-icon-rail
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Compact icon rail
        run: node scripts/apply-compact-icon-rail.mjs

      - name: Align Compact rail contract checks
        run: |
          printf '\n#compactRail,#compactDrawer{isolation:isolate}\n' >> src/styles/app.css
          node - <<'NODE'
          const fs = require('fs');
          const path = 'test/compact-view-foundation.test.mjs';
          let text = fs.readFileSync(path, 'utf8');
          text = text.replace('id="compactExit"', 'id="compactRailExit"');
          fs.writeFileSync(path, text);
          NODE

      - name: Verify project and standalone build
        run: npm run verify

      - name: Commit Compact icon rail
        run: |
          git restore --source=HEAD -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-compact-icon-rail.mjs
          git add -A
          git commit -m "Add Compact icon rail and temporary navigation drawer"
          git push origin HEAD:agent/compact-icon-rail
