name: Validate project

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/finalize-pre-react-baseline
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Record final pre-React baseline
        run: node scripts/finalize-pre-react-baseline.mjs

      - name: Verify project and standalone build
        run: npm run verify

      - name: Commit final baseline record
        run: |
          git restore --source=HEAD -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/finalize-pre-react-baseline.mjs
          git add docs/pre-react-release.md docs/react-migration-contract.md
          git commit -m "Record final pre-React baseline commit"
          git push origin HEAD:agent/finalize-pre-react-baseline
