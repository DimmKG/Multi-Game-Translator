name: Validate project

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply Issue 36 implementation
        if: github.ref_name == 'agent/new-translation-from-reference' && github.actor != 'github-actions[bot]'
        run: node scripts/apply-issue-36.mjs

      - name: Verify standalone build
        run: npm run verify

      - name: Commit Issue 36 implementation
        if: github.ref_name == 'agent/new-translation-from-reference' && github.actor != 'github-actions[bot]'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts test dist
          git commit -m "Implement new translation from reference [skip ci]"
          git push origin HEAD:agent/new-translation-from-reference
