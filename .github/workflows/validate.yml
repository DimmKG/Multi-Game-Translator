name: Validate project

on:
  push:
    branches:
      - main
      - "agent/**"
  pull_request:

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: agent/remove-russian-restore-defaults
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Apply restore-default cleanup
        run: node scripts/apply-remove-russian-restore-defaults.mjs

      - name: Verify project and standalone build
        run: npm run verify

      - name: Commit restore-default cleanup
        run: |
          git restore --source=HEAD -- .github/workflows/validate.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm scripts/apply-remove-russian-restore-defaults.mjs
          git add -A
          git commit -m "Remove implicit Russian restore defaults"
          git push origin HEAD:agent/remove-russian-restore-defaults
