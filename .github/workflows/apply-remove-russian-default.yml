name: Apply Russian-default hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/remove-russian-default
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Remove implicit Russian defaults
        run: node scripts/apply-remove-russian-default.mjs

      - name: Verify and rebuild
        run: npm run verify

      - name: Commit hotfix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test dist
          git diff --cached --quiet && exit 0
          git commit -m "Remove implicit Russian language defaults"
          git push origin HEAD:agent/remove-russian-default
