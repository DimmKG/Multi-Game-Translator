name: Migrate interface locales

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  migrate:
    if: github.head_ref == 'agent/interface-localization'
    runs-on: ubuntu-latest

    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: agent/interface-localization
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Disable workflow rewrite in migration
        run: sed -i 's#\.github/workflows/validate.yml#.migration-workflow-placeholder#' scripts/migrate-interface-locales.mjs

      - name: Run migration
        run: node scripts/migrate-interface-locales.mjs

      - name: Verify project
        run: npm run verify

      - name: Commit migrated structure
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Extract interface localization data"
          git push
