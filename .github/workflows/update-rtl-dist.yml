name: Rebuild RTL standalone

on:
  push:
    branches:
      - agent/split-built-in-locales

permissions:
  contents: write

jobs:
  rebuild:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verify and rebuild
        run: npm run verify
      - name: Commit standalone output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/necesse-lang-translator.html
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild standalone with RTL isolation"
          git push
