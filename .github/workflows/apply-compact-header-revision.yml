name: Apply compact header revision

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/responsive-localized-header
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply compact header revision
        run: node scripts/apply-compact-header-revision.mjs

      - name: Verify and rebuild
        run: npm run verify

      - name: Commit revision
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test dist
          git diff --cached --quiet && exit 0
          git commit -m "Keep localized header compact"
          git push origin HEAD:agent/responsive-localized-header
