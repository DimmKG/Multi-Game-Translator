name: Apply Settings tabs hotfix

on:
  push:
    branches:
      - agent/settings-tabs-hotfix

permissions:
  contents: write

concurrency:
  group: settings-tabs-hotfix
  cancel-in-progress: true

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/settings-tabs-hotfix
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify and rebuild
        run: npm run verify

      - name: Commit generated standalone build
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist
          git diff --cached --quiet && exit 0
          git commit -m "Rebuild standalone after Settings tabs hotfix"
          git push origin HEAD:agent/settings-tabs-hotfix
