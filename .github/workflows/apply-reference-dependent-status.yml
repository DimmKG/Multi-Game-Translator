name: Apply reference-dependent status

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/reference-dependent-status
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Apply issue 49 behavior
        run: node scripts/apply-reference-dependent-status.mjs

      - name: Verify and rebuild
        run: npm run verify

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src test dist
          git diff --cached --quiet && exit 0
          git commit -m "Hide reference-dependent status without a reference"
          git push origin HEAD:agent/reference-dependent-status
