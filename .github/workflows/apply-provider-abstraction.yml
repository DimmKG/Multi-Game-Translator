name: Apply provider abstraction

on:
  push:
    branches:
      - agent/mt-provider-abstraction
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mt-provider-abstraction
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix migration quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-provider-abstraction.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('throw new TypeError(`Provider ${definition.id} must define translate().`);', 'throw new TypeError("Provider " + definition.id + " must define translate().");')
          text = text.replace('if (providers.has(id)) throw new TypeError(`Duplicate machine-translation provider: ${id}`);', 'if (providers.has(id)) throw new TypeError("Duplicate machine-translation provider: " + id);')
          text = text.replace('const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sourceLanguage)}&tl=${encodeURIComponent(targetLanguage)}&dt=t&q=${encodeURIComponent(text)}`;', 'const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + encodeURIComponent(sourceLanguage) + "&tl=" + encodeURIComponent(targetLanguage) + "&dt=t&q=" + encodeURIComponent(text);')
          text = text.replace('throw new MtProviderError("http-error", `Google ${response.status}`, {', 'throw new MtProviderError("http-error", "Google " + response.status, {')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply migration
        run: node scripts/apply-provider-abstraction.mjs

      - name: Adjust regression tests
        run: |
          python - <<'PY'
          from pathlib import Path
          providers = Path('test/mt-providers.test.mjs')
          text = providers.read_text(encoding='utf-8')
          text = text.replace('/function register(definition)/', '/function register\\(definition\\)/')
          text = text.replace('/async function translate(id, request/', '/async function translate\\(id, request/')
          text = text.replace('assert.match(providers, /^pr(-br)?/);', 'assert.ok(providers.includes("if (/^pr(-br)?$/i.test(value))"));')
          text = text.replace('/registry.translate(validProvider(provider)/', '/registry\\.translate\\(validProvider\\(provider\\)/')
          text = text.replace('/setPreferredProvider(state.mtProvider)/', '/setPreferredProvider\\(state\\.mtProvider\\)/')
          text = text.replace('/scripts/mt/providers.js/', '/scripts\\/mt\\/providers\\.js/')
          providers.write_text(text, encoding='utf-8')

          target = Path('test/mt-target-language.test.mjs')
          text = target.read_text(encoding='utf-8')
          text = text.replace('const navigation = await readFile(new URL("../src/scripts/glossary/navigation.js", import.meta.url), "utf8");', 'const html = await readFile(new URL("../src/index.html", import.meta.url), "utf8");')
          text = text.replace('assert.match(navigation, /scripts\\/mt\\/target-language\\.js/);', 'assert.match(html, /scripts\\/mt\\/target-language\\.js/);')
          target.write_text(text, encoding='utf-8')
          PY

      - name: Verify
        run: npm run verify

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts test dist
          git diff --cached --quiet && exit 0
          git commit -m "Add machine translation provider abstraction"
          git push origin HEAD:agent/mt-provider-abstraction
