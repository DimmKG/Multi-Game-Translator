name: Apply provider abstraction

on:
  push:
    branches:
      - agent/mt-provider-abstraction
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mt-provider-abstraction
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Apply migration
        run: node scripts/apply-provider-abstraction.mjs

      - name: Verify
        run: npm run verify

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts test dist
          git diff --cached --quiet && exit 0
          git commit -m "Add machine translation provider abstraction"
          git push origin HEAD:agent/mt-provider-abstraction
