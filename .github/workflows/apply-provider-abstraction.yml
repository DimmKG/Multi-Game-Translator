name: Apply provider abstraction

on:
  push:
    branches:
      - agent/mt-provider-abstraction
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/mt-provider-abstraction
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fix migration quoting
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('scripts/apply-provider-abstraction.mjs')
          text = path.read_text(encoding='utf-8')
          text = text.replace('throw new TypeError(`Provider ${definition.id} must define translate().`);', 'throw new TypeError("Provider " + definition.id + " must define translate().");')
          text = text.replace('if (providers.has(id)) throw new TypeError(`Duplicate machine-translation provider: ${id}`);', 'if (providers.has(id)) throw new TypeError("Duplicate machine-translation provider: " + id);')
          text = text.replace('const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${encodeURIComponent(sourceLanguage)}&tl=${encodeURIComponent(targetLanguage)}&dt=t&q=${encodeURIComponent(text)}`;', 'const url = "https://translate.googleapis.com/translate_a/single?client=gtx&sl=" + encodeURIComponent(sourceLanguage) + "&tl=" + encodeURIComponent(targetLanguage) + "&dt=t&q=" + encodeURIComponent(text);')
          text = text.replace('throw new MtProviderError("http-error", `Google ${response.status}`, {', 'throw new MtProviderError("http-error", "Google " + response.status, {')
          path.write_text(text, encoding='utf-8')
          PY

      - name: Apply migration
        run: node scripts/apply-provider-abstraction.mjs

      - name: Verify
        run: npm run verify

      - name: Commit generated changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src scripts test dist
          git diff --cached --quiet && exit 0
          git commit -m "Add machine translation provider abstraction"
          git push origin HEAD:agent/mt-provider-abstraction
