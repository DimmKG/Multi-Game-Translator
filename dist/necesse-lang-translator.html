<script>"use strict";

(function initializeMtProviderSettingsUi() {
  const ui = { sections: new Map() };

  const t = key => globalThis.NecesseI18n?.t(key) || key;

  function fieldLabel(field) {
    return field.labelKey ? t(field.labelKey) : field.id;
  }

  function fieldHint(field) {
    return field.hintKey ? t(field.hintKey) : "";
  }

  function buildField(providerId, field) {
    const row = document.createElement("label");
    row.className = "settings-row settings-provider-row";

    const copy = document.createElement("span");
    copy.className = "settings-copy";
    const label = document.createElement("strong");
    const hint = document.createElement("span");
    label.textContent = fieldLabel(field);
    hint.textContent = fieldHint(field);
    copy.append(label, hint);

    const input = document.createElement("input");
    input.className = "settings-provider-input";
    input.type = field.type === "secret" ? "password" : "text";
    input.autocomplete = field.type === "secret" ? "off" : "on";
    input.spellcheck = false;
    input.required = field.required;
    input.placeholder = field.placeholder;
    input.dataset.provider = providerId;
    input.dataset.field = field.id;
    input.dataset.secret = field.type === "secret" ? "true" : "false";

    const store = globalThis.NecesseMtProviderSettings;
    const resolved = store?.resolve(providerId) || {};
    input.value = resolved[field.id] || "";
    input.addEventListener("change", () => {
      if (field.type === "secret") store?.setSecret(providerId, field.id, input.value);
      else store?.setPublic(providerId, field.id, input.value);
    });

    row.append(copy, input);
    return row;
  }

  function render() {
    const list = document.querySelector(".settings-list");
    const providers = globalThis.NecesseMtProviders?.getAll?.() || [];
    const store = globalThis.NecesseMtProviderSettings;
    if (!list || !store) return;

    for (const section of ui.sections.values()) section.remove();
    ui.sections.clear();

    for (const provider of providers) {
      const schema = store.schema(provider.id);
      if (!schema.length) continue;

      const section = document.createElement("section");
      section.className = "settings-provider-section";
      section.dataset.provider = provider.id;

      const title = document.createElement("h3");
      title.className = "settings-provider-title";
      title.textContent = provider.name;
      section.append(title);

      for (const field of schema) section.append(buildField(provider.id, field));
      list.append(section);
      ui.sections.set(provider.id, section);
    }
  }

  function injectStyles() {
    const style = document.createElement("style");
    style.textContent = `.settings-provider-section{display:grid;gap:10px;margin-top:10px}.settings-provider-title{margin:10px 2px 0;font-size:14px}.settings-provider-row{align-items:center}.settings-provider-input{min-width:220px;max-width:52%;margin-left:auto;padding:8px 10px;border:1px solid var(--line,#343944);border-radius:8px;background:var(--bg,#101217);color:inherit}.settings-provider-input[data-secret="true"]{font-family:monospace}`;
    document.head.append(style);
  }

  function initialize() {
    injectStyles();
    render();
    globalThis.addEventListener?.("necesse:mt-provider-registered", render);
    document.getElementById("uiLang")?.addEventListener("change", render);
    document.querySelector(".settings-open")?.addEventListener("click", render);
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize);
  else initialize();

  globalThis.NecesseMtProviderSettingsUi = Object.freeze({ render });
})();

<script>"use strict";

(function initializeMtSecretVaultUi() {
  const ui = {};
  const fallback = Object.freeze({
    "settings.secretVaultTitle": "Encrypted provider secrets",
    "settings.secretVaultHint": "Secrets stay in memory unless you export this password-protected file. The password is never saved.",
    "settings.secretVaultEmpty": "No provider secrets are currently unlocked.",
    "settings.secretVaultUnlocked": "{n} provider secret(s) are currently unlocked.",
    "settings.secretVaultExport": "Export encrypted secrets",
    "settings.secretVaultImport": "Import encrypted secrets",
    "settings.secretVaultClear": "Lock and clear secrets",
    "settings.secretVaultCreatePassword": "Create a password for the encrypted file",
    "settings.secretVaultEnterPassword": "Enter the encrypted file password",
    "settings.secretVaultPassword": "Password",
    "settings.secretVaultConfirmPassword": "Confirm password",
    "settings.secretVaultPasswordMismatch": "The passwords do not match.",
    "settings.secretVaultCancel": "Cancel",
    "settings.secretVaultContinue": "Continue",
    "settings.secretVaultExportError": "Could not export encrypted secrets.",
    "settings.secretVaultImportError": "Could not import encrypted secrets."
  });
  const t = key => {
    const translated = globalThis.NecesseI18n?.t(key);
    return translated && translated !== key ? translated : (fallback[key] || key);
  };

  function secretCount() {
    return globalThis.NecesseMtProviderSettings?.secretCount?.() || 0;
  }

  function update() {
    if (!ui.section) return;
    const count = secretCount();
    ui.status.textContent = count
      ? t("settings.secretVaultUnlocked").replace("{n}", count)
      : t("settings.secretVaultEmpty");
    ui.export.disabled = count === 0;
    ui.clear.disabled = count === 0;
  }

  function askPassphrase(confirmValue) {
    return new Promise(resolve => {
      const dialog = document.createElement("dialog");
      dialog.className = "settings-vault-dialog";
      const form = document.createElement("form");
      form.method = "dialog";
      const title = document.createElement("h3");
      title.textContent = confirmValue ? t("settings.secretVaultCreatePassword") : t("settings.secretVaultEnterPassword");
      const password = document.createElement("input");
      password.type = "password";
      password.autocomplete = "new-password";
      password.required = true;
      password.placeholder = t("settings.secretVaultPassword");
      const confirmation = document.createElement("input");
      confirmation.type = "password";
      confirmation.autocomplete = "new-password";
      confirmation.required = confirmValue;
      confirmation.placeholder = t("settings.secretVaultConfirmPassword");
      if (!confirmValue) confirmation.hidden = true;
      const error = document.createElement("p");
      error.className = "settings-vault-error";
      const actions = document.createElement("div");
      actions.className = "settings-vault-actions";
      const cancel = document.createElement("button");
      cancel.type = "button";
      cancel.textContent = t("settings.secretVaultCancel");
      const accept = document.createElement("button");
      accept.type = "submit";
      accept.className = "btn primary";
      accept.textContent = t("settings.secretVaultContinue");
      actions.append(cancel, accept);
      form.append(title, password, confirmation, error, actions);
      dialog.append(form);
      document.body.append(dialog);

      function finish(value) {
        dialog.close();
        dialog.remove();
        resolve(value);
      }

      cancel.addEventListener("click", () => finish(""));
      dialog.addEventListener("cancel", event => {
        event.preventDefault();
        finish("");
      });
      form.addEventListener("submit", event => {
        event.preventDefault();
        if (!password.value) return;
        if (confirmValue && password.value !== confirmation.value) {
          error.textContent = t("settings.secretVaultPasswordMismatch");
          confirmation.focus();
          return;
        }
        finish(password.value);
      });
      dialog.showModal();
      password.focus();
    });
  }

  function download(text) {
    const blob = new Blob([text], { type: "application/json" });
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    const date = new Date().toISOString().slice(0, 10);
    anchor.href = url;
    anchor.download = `necesse-provider-secrets-${date}.json`;
    document.body.append(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 0);
  }

  async function exportVault() {
    const store = globalThis.NecesseMtProviderSettings;
    const vault = globalThis.NecesseMtSecretVault;
    if (!store || !vault || !secretCount()) return;
    const passphrase = await askPassphrase(true);
    if (!passphrase) return;
    try {
      download(await vault.encrypt(store.exportSecrets(), passphrase));
    } catch (error) {
      alert(t("settings.secretVaultExportError") + " " + (error?.message || error));
    }
  }

  async function importVault(file) {
    const store = globalThis.NecesseMtProviderSettings;
    const vault = globalThis.NecesseMtSecretVault;
    if (!file || !store || !vault) return;
    const passphrase = await askPassphrase(false);
    if (!passphrase) return;
    try {
      const secrets = await vault.decrypt(await file.text(), passphrase);
      store.importSecrets(secrets, { replace: true });
      globalThis.NecesseMtProviderSettingsUi?.render?.();
      update();
    } catch (error) {
      alert(t("settings.secretVaultImportError") + " " + (error?.message || error));
    }
  }

  function build() {
    const list = document.querySelector(".settings-list");
    if (!list || ui.section) return;
    const section = document.createElement("section");
    section.className = "settings-provider-section settings-vault-section";
    const title = document.createElement("h3");
    title.className = "settings-provider-title";
    title.textContent = t("settings.secretVaultTitle");
    const hint = document.createElement("p");
    hint.className = "settings-vault-hint";
    hint.textContent = t("settings.secretVaultHint");
    ui.status = document.createElement("p");
    ui.status.className = "settings-vault-status";
    const actions = document.createElement("div");
    actions.className = "settings-vault-actions";
    ui.export = document.createElement("button");
    ui.export.type = "button";
    ui.export.textContent = t("settings.secretVaultExport");
    ui.import = document.createElement("button");
    ui.import.type = "button";
    ui.import.textContent = t("settings.secretVaultImport");
    ui.clear = document.createElement("button");
    ui.clear.type = "button";
    ui.clear.textContent = t("settings.secretVaultClear");
    ui.file = document.createElement("input");
    ui.file.type = "file";
    ui.file.accept = ".json,application/json";
    ui.file.hidden = true;
    actions.append(ui.export, ui.import, ui.clear);
    section.append(title, hint, ui.status, actions, ui.file);
    list.append(section);
    ui.section = section;

    ui.export.addEventListener("click", exportVault);
    ui.import.addEventListener("click", () => ui.file.click());
    ui.file.addEventListener("change", async () => {
      const [file] = ui.file.files || [];
      ui.file.value = "";
      await importVault(file);
    });
    ui.clear.addEventListener("click", () => {
      globalThis.NecesseMtProviderSettings?.clearSecrets?.();
      globalThis.NecesseMtProviderSettingsUi?.render?.();
      update();
    });
    update();
  }

<script type="module">{
"use strict";

const GLOSSARY_FORMAT = "necesse-glossary";
const CATALOG_FORMAT = "necesse-glossary-catalog";
const FORMAT_VERSION = 1;
const ID_PATTERN = /^[a-z0-9][a-z0-9._-]*$/;
const LANGUAGE_PATTERN = /^[A-Za-z]{2,3}(?:-[A-Za-z0-9]{2,8})*$/;
const ENTRY_STATUSES = new Set(["approved", "draft", "deprecated", "context-dependent"]);

function assertObject(value, label) {
  if (!value || typeof value !== "object" || Array.isArray(value)) throw new TypeError(`${label} must be an object.`);
}

function assertString(value, label) {
  if (typeof value !== "string" || value.length === 0) throw new TypeError(`${label} must be a non-empty string.`);
}

function assertLanguage(value, label) {
  assertString(value, label);
  if (!LANGUAGE_PATTERN.test(value)) throw new TypeError(`${label} is not a supported language tag.`);
}

function assertStringArray(value, label) {
  if (value === undefined) return;
  if (!Array.isArray(value) || value.some(item => typeof item !== "string" || item.length === 0)) {
    throw new TypeError(`${label} must be an array of non-empty strings.`);
  }
  if (new Set(value).size !== value.length) throw new TypeError(`${label} must not contain duplicates.`);
}

function normalizeEntry(entry, index) {
  assertObject(entry, `entries[${index}]`);
  assertString(entry.source, `entries[${index}].source`);
  assertString(entry.target, `entries[${index}].target`);
  assertStringArray(entry.forms, `entries[${index}].forms`);
  assertStringArray(entry.alternatives, `entries[${index}].alternatives`);
  assertStringArray(entry.forbidden, `entries[${index}].forbidden`);

  const status = entry.status ?? "approved";
  if (!ENTRY_STATUSES.has(status)) throw new TypeError(`entries[${index}].status is not supported.`);

  return Object.freeze({
    source: entry.source,
    target: entry.target,
    forms: Object.freeze([...(entry.forms ?? [])]),
    alternatives: Object.freeze([...(entry.alternatives ?? [])]),
    forbidden: Object.freeze([...(entry.forbidden ?? [])]),
    caseSensitive: entry.caseSensitive ?? false,
    wholeWord: entry.wholeWord ?? true,
    status,
    category: entry.category ?? "",
    context: entry.context ?? "",
    note: entry.note ?? ""
  });
}

function parseJsonDocument(text, label = "JSON document") {
  if (typeof text !== "string") throw new TypeError(`${label} must be text.`);
  try { return JSON.parse(text.replace(/^\uFEFF/, "")); }
  catch (error) { throw new SyntaxError(`${label} is not valid JSON: ${error.message}`); }

  assertObject(input, "Glossary");
  if (input.format !== GLOSSARY_FORMAT || input.version !== FORMAT_VERSION) throw new TypeError("Unsupported glossary format or version.");
  assertString(input.id, "Glossary id");
  if (!ID_PATTERN.test(input.id)) throw new TypeError("Glossary id is invalid.");
  assertString(input.name, "Glossary name");
  assertLanguage(input.sourceLanguage, "Glossary sourceLanguage");
  assertLanguage(input.targetLanguage, "Glossary targetLanguage");
  if (!Array.isArray(input.entries)) throw new TypeError("Glossary entries must be an array.");

  return Object.freeze({
    format: GLOSSARY_FORMAT,
    version: FORMAT_VERSION,
    id: input.id,
    name: input.name,
    sourceLanguage: input.sourceLanguage,
    targetLanguage: input.targetLanguage,
    game: input.game ?? "",
    authors: Object.freeze([...(input.authors ?? [])]),
    updatedAt: input.updatedAt ?? "",

  const ids = new Set();

    assertObject(item, `glossaries[${index}]`);
    assertString(item.id, `glossaries[${index}].id`);
    if (!ID_PATTERN.test(item.id)) throw new TypeError(`glossaries[${index}].id is invalid.`);
    if (ids.has(item.id)) throw new TypeError(`Duplicate glossary id: ${item.id}`);
    ids.add(item.id);
    assertString(item.name, `glossaries[${index}].name`);
    assertLanguage(item.sourceLanguage, `glossaries[${index}].sourceLanguage`);
    assertLanguage(item.targetLanguage, `glossaries[${index}].targetLanguage`);
    assertString(item.url, `glossaries[${index}].url`);
    return Object.freeze({
      id: item.id,
      name: item.name,
      sourceLanguage: item.sourceLanguage,
      targetLanguage: item.targetLanguage,
      url: baseUrl ? new URL(item.url, baseUrl).href : item.url,

  const count = rows.filter(isIssue).length;
  const output = document.getElementById("rc-issues");
  if (output) output.textContent = String(count);
}

function applyCustomFilter() {
  if (!customIssuesMode) return;
  for (const row of reviewList()?.querySelectorAll(".rrow") || []) {
    row.hidden = !isIssue(row);
  }
  document.querySelectorAll(".rchip").forEach(button => {
    button.classList.toggle("on", button.dataset.r === "issues");
  });
}

function refresh() {
  scheduled = false;
  const rows = reviewList()?.querySelectorAll(".rrow") || [];
  rows.forEach(annotateRow);
  updateIssueCount();
  applyCustomFilter();
}

function scheduleRefresh() {
  if (scheduled) return;
  scheduled = true;
  requestAnimationFrame(refresh);
}

function showCombinedIssues(event) {
  const button = event.target.closest?.('.rchip[data-r="issues"]');
  if (!button) return;

  event.preventDefault();
  event.stopImmediatePropagation();
  customIssuesMode = true;

  allButton()?.click();
  scheduleRefresh();
}

function leaveCustomMode(event) {
  const button = event.target.closest?.(".rchip");
  if (!button || button.dataset.r === "issues") return;
  customIssuesMode = false;
  reviewList()?.querySelectorAll(".rrow[hidden]").forEach(row => { row.hidden = false; });
}

function injectStyles() {
  const style = document.createElement("style");
  style.textContent = `.rflag.term{border-color:color-mix(in srgb,var(--warn,#d9a441) 65%,var(--line,#343944));background:color-mix(in srgb,var(--warn,#d9a441) 12%,transparent)}.rrow.term-review-flagged{box-shadow:inset 3px 0 0 color-mix(in srgb,var(--warn,#d9a441) 75%,transparent)}`;
  document.head.append(style);
}

function start() {
  injectStyles();
  document.addEventListener("click", showCombinedIssues, true);
  document.addEventListener("click", leaveCustomMode, true);
  reviewList()?.addEventListener("input", scheduleRefresh);
  document.getElementById("uiLang")?.addEventListener("change", scheduleRefresh);
  globalThis.NecesseGlossaries?.subscribe?.(() => {
    if (customIssuesMode) allButton()?.click();
    scheduleRefresh();
  });

  const list = reviewList();
  if (list) new MutationObserver(scheduleRefresh).observe(list, { childList: true, subtree: true });
  scheduleRefresh();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", start);
else start();

}

(function initializeMtTargetLanguage() {
  const LANGUAGE_OPTIONS = Object.freeze([
    ["ar", "العربية"], ["bg", "Български"], ["ca", "Català"], ["cs", "Čeština"],
    ["da", "Dansk"], ["de", "Deutsch"], ["en", "English"], ["es", "Español"],
    ["fi", "Suomi"], ["fr", "Français"], ["hr", "Hrvatski"], ["hu", "Magyar"],
    ["id", "Bahasa Indonesia"], ["it", "Italiano"], ["ja", "日本語"], ["ko", "한국어"],
    ["lt", "Lietuvių"], ["nl", "Nederlands"], ["no", "Norsk"], ["pl", "Polski"],
    ["pt-BR", "Português (Brasil)"], ["pt-PT", "Português (Portugal)"], ["ru", "Русский"],
    ["se", "Svenska"], ["th", "ไทย"], ["tr", "Türkçe"], ["uk", "Українська"],
    ["vi", "Tiếng Việt"], ["zh-CN", "中文（简体）"], ["zh-TW", "中文（繁體）"]
  ]);

  const RECOGNIZED = new Map(LANGUAGE_OPTIONS.map(([code]) => [code.toLowerCase(), code]));
  const LEGACY_ALIASES = new Map([
    ["pr", "pt-BR"], ["pr-br", "pt-BR"], ["pt", "pt-BR"],
    ["zh-hk", "zh-TW"], ["nb-no", "no"], ["nn-no", "no"]
  ]);

  function t(key) {
    return globalThis.NecesseI18n?.t(key) || key;
  }

  function normalizeProjectCode(value) {
    const raw = String(value || "").trim().replace(/_/g, "-");
    if (!raw) return "";
    const lower = raw.toLowerCase();
    return LEGACY_ALIASES.get(lower) || RECOGNIZED.get(lower) || "";
  }

  function codeFromFilename(filename) {
    const name = String(filename || "").trim().replace(/^.*[\\/]/, "");
    if (!/\.lang$/i.test(name)) return "";
    const base = name.replace(/\.lang$/i, "")
      .replace(/\s*\(\d+\)\s*$/, "")
      .replace(/_\d+_?$/g, "");
    return normalizeProjectCode(base);
  }

  function injectStyles() {
    const style = document.createElement("style");
    style.textContent = `#mtTarget[hidden]{display:none!important}#mtTargetSelect{width:auto;min-width:180px;max-width:240px}.mtbtn[data-mt-target-missing="true"]{opacity:.45;cursor:not-allowed}`;
    document.head.append(style);
  }

  function buildSelector(input) {
    const select = document.createElement("select");
    select.id = "mtTargetSelect";
    select.className = input.className;
    select.title = input.title || t("mt.langTitle");
    select.setAttribute("aria-label", select.title);

    const empty = document.createElement("option");
    empty.value = "";
    empty.textContent = "—";
    empty.disabled = true;
    select.append(empty);

    for (const [code, label] of LANGUAGE_OPTIONS) {
      const option = document.createElement("option");
      option.value = code;
      option.textContent = `${label} (${code})`;
      select.append(option);
    }

    input.hidden = true;
    input.tabIndex = -1;
    input.insertAdjacentElement("afterend", select);
    return select;
  }

  function commitSelection(input, select, code) {
    if (!code) {
      select.value = "";
      return;
    }
    input.value = code;
    input.dispatchEvent(new Event("input", { bubbles: true }));
    input.dispatchEvent(new Event("change", { bubbles: true }));
    select.value = code;
  }

  function applyAvailability(select) {
    const disabled = !select.value;
    for (const button of document.querySelectorAll(".mtbtn")) {
      button.disabled = disabled || button.classList.contains("loading");
      button.dataset.mtTargetMissing = disabled ? "true" : "false";
    }
  }

  function filename() {
    return document.getElementById("outName")?.value || "";
  }

  function syncFromWorkspace(input, select) {
    const current = normalizeProjectCode(input.value);
    const inferred = codeFromFilename(filename());
    const chosen = current || inferred;

    select.value = chosen;
    if (chosen && input.value !== chosen) commitSelection(input, select, chosen);
    if (!chosen) input.value = "";
    applyAvailability(select);
  }

  function initialize() {
    const input = document.getElementById("mtTarget");
    if (!input || document.getElementById("mtTargetSelect")) return;

    injectStyles();
    const select = buildSelector(input);

    select.addEventListener("change", () => {
      if (!select.value) return;
      commitSelection(input, select, select.value);
      applyAvailability(select);
    });

    const workspaceObserver = new MutationObserver(() => syncFromWorkspace(input, select));
    const actions = document.getElementById("topActions");
    const list = document.getElementById("list");
    if (actions) workspaceObserver.observe(actions, { attributes: true, attributeFilter: ["style", "class", "hidden"] });
    if (list) workspaceObserver.observe(list, { childList: true });

    document.getElementById("outName")?.addEventListener("change", () => syncFromWorkspace(input, select));
    document.getElementById("outName")?.addEventListener("blur", () => syncFromWorkspace(input, select));
    document.getElementById("uiLang")?.addEventListener("change", () => {
      select.title = t("mt.langTitle");
      select.setAttribute("aria-label", select.title);
    });

    document.addEventListener("click", event => {
      const button = event.target.closest?.(".mtbtn");
      if (!button || select.value) return;
      event.preventDefault();
      event.stopImmediatePropagation();
      select.focus();
    }, true);

    syncFromWorkspace(input, select);

    globalThis.NecesseMtTarget = Object.freeze({
      languages: LANGUAGE_OPTIONS.map(([code, name]) => ({ code, name })),
      normalizeProjectCode,
      codeFromFilename,
      get: () => select.value,
      set(code) {
        const normalized = normalizeProjectCode(code);
        commitSelection(input, select, normalized);
        applyAvailability(select);
      }
    });
  }

  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", initialize);
  else initialize();
})();

}
{
"use strict";

const navT = (key, vars) => globalThis.NecesseI18n?.t(key, vars) || key;
const navPlural = (base, count, vars) => globalThis.NecesseI18n?.plural(base, count, vars) || String(count);
let terminologyFilterActive = false;
let currentIssueIndex = -1;
let refreshQueued = false;
const navUi = {};

function flaggedCards() {
  return [...document.querySelectorAll("#list .card.term-qa-flagged")];
}

function standardFilters() {
  return [...document.querySelectorAll("#filters .filt:not(.term-nav-filter)")];
}

function showToast(message) {
  const toast = document.getElementById("toast");
  if (!toast) return;
  toast.textContent = message;
  toast.classList.add("show");
  window.clearTimeout(showToast.timer);
  showToast.timer = window.setTimeout(() => toast.classList.remove("show"), 2200);
}

function applyTerminologyVisibility() {
  document.querySelectorAll("#list .card").forEach(card => {
    card.classList.toggle("term-nav-hidden", terminologyFilterActive && !card.classList.contains("term-qa-flagged"));
  });
}

function updateControls() {
  if (!navUi.filter || !navUi.summary) return;
  const cards = flaggedCards();
  const count = cards.length;
  navUi.label.textContent = navT("terminology.filter");
  navUi.filter.title = navT("terminology.filterTitle");
  navUi.filter.classList.toggle("on", terminologyFilterActive);
  navUi.filter.classList.toggle("warn", count > 0);
  navUi.count.textContent = String(count);
  navUi.summary.textContent = navPlural("terminology.count", count);
  navUi.summary.title = navT("terminology.next");
  navUi.summary.disabled = count === 0;
  applyTerminologyVisibility();
}

function queueRefresh() {
  if (refreshQueued) return;
  refreshQueued = true;
  requestAnimationFrame(() => {
    refreshQueued = false;
    updateControls();
  });
}

function activateAllEntries() {
  const all = document.querySelector('.filt[data-f="all"]');
  if (all && !all.classList.contains("on")) all.click();
}

function clearStandardFilterSelection() {
  standardFilters().forEach(button => button.classList.remove("on"));
}

function deactivateTerminologyFilter() {
  if (!terminologyFilterActive) return;
  terminologyFilterActive = false;
  currentIssueIndex = -1;
  applyTerminologyVisibility();
  queueRefresh();
}

function toggleTerminologyFilter() {
  const activate = !terminologyFilterActive;
  currentIssueIndex = -1;

  if (activate) {
    activateAllEntries();
    terminologyFilterActive = true;
    clearStandardFilterSelection();
  } else {
    terminologyFilterActive = false;
    activateAllEntries();
  }

  queueRefresh();
}

function focusNextIssue() {
  const cards = flaggedCards().filter(card => !card.classList.contains("term-nav-hidden"));
  if (!cards.length) {
    showToast(navT("terminology.none"));
    return;
  }
  currentIssueIndex = (currentIssueIndex + 1) % cards.length;
  const card = cards[currentIssueIndex];
  card.scrollIntoView({ behavior: "smooth", block: "center" });
  card.classList.remove("term-nav-pulse");
  void card.offsetWidth;
  card.classList.add("term-nav-pulse");
  card.querySelector("textarea")?.focus({ preventScroll: true });
}

function buildControls() {
  const filters = document.getElementById("filters");
  if (filters) {
    navUi.filter = document.createElement("button");
    navUi.filter.className = "filt term-nav-filter";
    navUi.filter.type = "button";
    const left = document.createElement("span");
    left.className = "l";
    const dot = document.createElement("i");
    dot.className = "dot term-nav-dot";
    navUi.label = document.createElement("span");
    left.append(dot, navUi.label);
    navUi.count = document.createElement("span");
    navUi.count.className = "cnt";
    navUi.filter.append(left, navUi.count);
    navUi.filter.addEventListener("click", toggleTerminologyFilter);
    filters.append(navUi.filter);

    standardFilters().forEach(button => {
      button.addEventListener("click", deactivateTerminologyFilter);
    });
  }

  const toolbar = document.getElementById("toolbar");
  if (toolbar) {
    navUi.summary = document.createElement("button");
    navUi.summary.className = "qbtn term-nav-summary";
    navUi.summary.type = "button";
    navUi.summary.addEventListener("click", focusNextIssue);
    toolbar.insertBefore(navUi.summary, toolbar.querySelector(".qhint"));
  }
}

function injectNavigationStyles() {
  const style = document.createElement("style");
  style.textContent = `.term-nav-dot{background:var(--warn,#d9a441)}.term-nav-hidden{display:none!important}.term-nav-summary:disabled{opacity:.55;cursor:default}.term-nav-summary:not(:disabled){border-color:color-mix(in srgb,var(--warn,#d9a441) 55%,var(--line,#343944))}.term-nav-pulse{animation:term-nav-pulse .7s ease-out}@keyframes term-nav-pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--warn,#d9a441) 65%,transparent)}100%{box-shadow:0 0 0 14px transparent}}`;
  document.head.append(style);
}

function startTerminologyNavigation() {
  injectNavigationStyles();
  buildControls();
  document.getElementById("uiLang")?.addEventListener("change", queueRefresh);

  const list = document.getElementById("list");
  if (list) {
    new MutationObserver(queueRefresh).observe(list, {
      childList: true,
      subtree: true,
      attributes: true,
      attributeFilter: ["class"]
    });
  }
  globalThis.NecesseGlossaries?.subscribe?.(queueRefresh);
  updateControls();
}

if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", startTerminologyNavigation);
else startTerminologyNavigation();
